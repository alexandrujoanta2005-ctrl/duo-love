  <style>

    body.chat-page-body {
      height: 100dvh !important;

    }


    .chat-app {
      height: 100dvh !important;

      display: flex !important;
      flex-direction: column !important;

      overflow: hidden !important;

      padding-bottom:

    }


    .chat-header {
      flex: 0 0 auto !important;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }


    .chat-header-copy {
      min-width: 0;
    }


    .chat-header h1 {
      margin-bottom: 4px;
    }


    .chat-live-status {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      gap: 6px;

      padding:
        7px 10px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.055);

      color:
        rgba(255,255,255,.66);

      font-size: 10px;

    .chat-live-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

    .chat-live-status.online
    .chat-live-dot {

    .chat-card {
      flex: 1 1 0 !important;

    .chat-partner-banner {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 9px;
      padding: 10px 12px;

      border:
        1px solid
        rgba(255,255,255,.075);

      border-radius: 16px;

      background:
        rgba(255,255,255,.04);
    }


    .chat-partner-avatar {
      flex: 0 0 38px;

      display: grid;
      place-items: center;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #c95887,
          #7457be
        );

      font-size: 18px;
    }


    .chat-partner-copy {
      min-width: 0;
    }


    .chat-partner-copy strong,
    .chat-partner-copy span {
      display: block;
    }


    .chat-partner-copy strong {
      overflow: hidden;

      color: white;

      font-size: 13px;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .chat-partner-copy span {
      margin-top: 2px;

      color:
        rgba(255,255,255,.50);

      font-size: 9px;
    }


    #chatMessages {
      flex: 1 1 0 !important;

      min-height: 0 !important;

      overflow-y: auto !important;
      overflow-x: hidden !important;

      padding: 10px 3px 18px !important;

      -webkit-overflow-scrolling: touch !important;

      overscroll-behavior: contain !important;

      scrollbar-width: none !important;
    }


    #chatMessages::-webkit-scrollbar {
      display: none !important;
    }


    .chat-empty {
      display: grid;
      place-items: center;

      min-height: 100%;

      padding: 30px;

      box-sizing: border-box;

      color:
        rgba(255,255,255,.48);

      font-size: 13px;
      line-height: 1.5;

      text-align: center;
    }


    .chat-message-row {
      display: flex;
      flex-direction: column;

      margin-bottom: 10px;
    }


    .chat-message-row.mine {
      align-items: flex-end;
    }


    .chat-message-row.partner {
      align-items: flex-start;
    }


    .chat-message {
      width: fit-content;
      max-width: 84%;

      padding:
        10px 13px;

      border-radius: 19px;

      color: white;

      font-size: 15px;
      line-height: 1.45;

      white-space: pre-wrap;
      word-break: break-word;
    }


    .chat-message-row.mine
    .chat-message {
      border-bottom-right-radius: 6px;

      background:
        linear-gradient(
          135deg,
          rgba(201,88,135,.92),
          rgba(145,61,104,.92)
        );
    }


    .chat-message-row.partner
    .chat-message {
      border-bottom-left-radius: 6px;

      background:
        rgba(255,255,255,.095);
    }


    .chat-message-meta {
      margin-top: 4px;

      color:
        rgba(255,255,255,.36);

      font-size: 8px;
      font-weight: 650;
    }


    .chat-quick {
      flex: 0 0 auto;

      display: flex;
      gap: 7px;

      overflow-x: auto;

      padding:
        2px 0 9px;

      scrollbar-width: none;
    }


    .chat-quick::-webkit-scrollbar {
      display: none;
    }


    .chat-quick button {
      flex: 0 0 auto;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 999px;

      padding:
        8px 11px;

      background:
        rgba(255,255,255,.06);

      color: white;

      font: inherit;
      font-size: 11px;

      cursor: pointer;
    }


    .chat-input-row {
      flex: 0 0 auto;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }


    #chatInput {
      flex: 1 1 auto;

      min-width: 0;
      min-height: 54px;
      max-height: 110px;

      box-sizing: border-box;

      padding:
        15px;

      resize: none;

      border:
        1px solid
        rgba(255,255,255,.10);

      outline: none;

      border-radius: 19px;

      background:
        rgba(255,255,255,.09);

      color: white;

      font: inherit;
      font-size: 16px;
    }


    #chatInput::placeholder {
      color:
        rgba(255,255,255,.40);
    }


    #sendButton {
      flex: 0 0 54px;

      width: 54px;
      height: 54px;

      border: 0;
      border-radius: 18px;

      background:
        #cf5f8e;

      color: white;

      font-size: 21px;

      cursor: pointer;
    }


    #sendButton:disabled,
    #chatInput:disabled {
      opacity: .55;
    }


    .chat-error {
      flex: 0 0 auto;

      min-height: 17px;

      margin:
        7px 0 0;

      color: #ffb8d4;

      font-size: 10px;

      text-align: center;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js?v=31"></script>
  <script src="./security.js?v=32"></script>
  <script src="./cloud-sync.js?v=41"></script>
  <script src="./tema.js?v=54"></script>

  <script>

    console.log(
      "❤️ DUO LOVE BUILD v39 - REAL COUPLE CHAT"
    );


    const messagesBox =
      document.getElementById(
        "chatMessages"
      );


    const input =
      document.getElementById(
        "chatInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const chatError =
      document.getElementById(
        "chatError"
      );


    const chatPartnerName =
      document.getElementById(
        "chatPartnerName"
      );


    const chatTitle =
      document.getElementById(
        "chatTitle"
      );


    const chatLiveStatus =
      document.getElementById(
        "chatLiveStatus"
      );


    const chatLiveText =
      document.getElementById(
        "chatLiveText"
      );


    let currentUser =
      null;


    let currentCoupleId =
      null;


    let chatMessages =
      [];


    let realtimeChannel =
      null;


    let refreshTimer =
      null;


    let sending =
      false;



    function normalizePersonName(
      value
    ) {

      return String(
        value ||
        ""
      )
        .trim()
        .toLocaleLowerCase(
          "ro-RO"
        )
        .normalize(
          "NFD"
        )
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }


    function getFirstWord(
      value
    ) {

      return String(
        value ||
        ""
      )
        .trim()
        .split(
          /\s+/
        )[0] ||
        "";

    }


    function getPartnerDisplayName() {

      const first =
        localStorage.getItem(
          "firstName"
        ) ||
        "Alex";


      const second =
        localStorage.getItem(
          "secondName"
        ) ||
        "Bianca";


      const meta =
        currentUser &&
        currentUser.user_metadata
          ? currentUser.user_metadata
          : {};


      const own =
        getFirstWord(
          meta.first_name ||
          meta.given_name ||
          meta.full_name ||
          meta.name ||
          ""
        );


      const ownNormalized =
        normalizePersonName(
          own
        );


      if (
        ownNormalized &&
        normalizePersonName(
          first
        ) ===
          ownNormalized
      ) {

        return second;

      }


      if (
        ownNormalized &&
        normalizePersonName(
          second
        ) ===
          ownNormalized
      ) {

        return first;

      }


      return second ||
        "Partener";

    }


    function setChatReady(
      ready,
      text
    ) {

      input.disabled =
        !ready;


      sendButton.disabled =
        !ready;


      chatLiveStatus.classList.toggle(
        "online",
        ready
      );


      chatLiveText.textContent =
        text ||
        (
          ready
            ? "Conectat"
            : "Conectare..."
        );

    }


    function formatMessageTime(
      value
    ) {

      const date =
        new Date(
          value
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        "ro-RO",
        {
          hour:
            "2-digit",

          minute:
            "2-digit",

          timeZone:
            "Europe/Bucharest"
        }
      );

    }


    function scrollBottom() {

      requestAnimationFrame(
        function () {

          messagesBox.scrollTop =
            messagesBox.scrollHeight;

        }
      );

    }


    function renderMessages() {

      messagesBox.innerHTML =
        "";


      if (
        !chatMessages.length
      ) {

        messagesBox.innerHTML =
          `
            <div class="chat-empty">
              💌 Încă nu aveți mesaje aici.<br>
              Scrie primul mesaj pentru partenerul tău. ❤️
            </div>
          `;


        return;

      }


      chatMessages.forEach(
        function (
          message
        ) {

          const mine =
            message.sender_id ===
            currentUser.id;


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "chat-message-row " +
            (
              mine
                ? "mine"
                : "partner"
            );


          const bubble =
            document.createElement(
              "div"
            );


          bubble.className =
            "chat-message";


          bubble.textContent =
            message.body;


          const meta =
            document.createElement(
              "div"
            );


          meta.className =
            "chat-message-meta";


          meta.textContent =
            (
              mine
                ? "Tu"
                : getPartnerDisplayName()
            ) +
            " · " +
            formatMessageTime(
              message.created_at
            );


          row.appendChild(
            bubble
          );


          row.appendChild(
            meta
          );


          messagesBox.appendChild(
            row
          );

        }
      );


      scrollBottom();

    }


    function mergeMessages(
      rows
    ) {

      const map =
        new Map();


      chatMessages
        .concat(
          Array.isArray(rows)
            ? rows
            : []
        )
        .forEach(
          function (
            item
          ) {

            if (
              item &&
              item.id
            ) {

              map.set(
                item.id,
                item
              );

            }

          }
        );


      chatMessages =
        Array.from(
          map.values()
        )
          .sort(
            function (
              a,
              b
            ) {

              return (
                new Date(
                  a.created_at
                ) -
                new Date(
                  b.created_at
                )
              );

            }
          )
          .slice(
            -120
          );

    }


    async function resolveChatContext() {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        return false;

      }


      const {
        data:
          sessionData,
        error:
          sessionError
      } =
        await supabaseClient
          .auth
          .getSession();


      if (
        sessionError ||
        !sessionData ||
        !sessionData.session
      ) {

        window.location.href =
          "./login.html";


        return false;

      }


      currentUser =
        sessionData.session.user;


      if (
        typeof window.getMyCoupleId ===
        "function"
      ) {

        currentCoupleId =
          await window
            .getMyCoupleId();

      }


      if (
        !currentCoupleId
      ) {

        const {
          data
        } =
          await supabaseClient
            .from(
              "couple_members"
            )
            .select(
              "couple_id"
            )
            .eq(
              "user_id",
              currentUser.id
            )
            .limit(
              1
            )
            .maybeSingle();


        currentCoupleId =
          data &&
          data.couple_id
            ? data.couple_id
            : null;

      }


      if (
        !currentCoupleId
      ) {

        chatError.textContent =
          "Conectați conturile din Setări ca să puteți vorbi aici. ❤️";


        setChatReady(
          false,
          "Fără partener"
        );


        return false;

      }


      const partner =
        getPartnerDisplayName();


      chatPartnerName.textContent =
        partner;


      chatTitle.textContent =
        "Chat cu " +
        partner +
        " ❤️";


      return true;

    }


    async function loadChatMessages(
      silent = false
    ) {

      if (
        !currentCoupleId
      ) {

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "couple_chat_messages"
          )
          .select(
            "id,couple_id,sender_id,body,created_at"
          )
          .eq(
            "couple_id",
            currentCoupleId
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          )
          .limit(
            120
          );


      if (
        error
      ) {

        console.error(
          "Eroare citire chat:",
          error
        );


        if (
          !silent
        ) {

          chatError.textContent =
            "Chatul nu poate fi încărcat. Rulează SQL-ul v39 în Supabase.";

        }


        return;

      }


      mergeMessages(
        (
          data ||
          []
        )
          .slice()
          .reverse()
      );


      renderMessages();

    }


    function startRealtimeChat() {

      if (
        !currentCoupleId ||
        typeof supabaseClient.channel !==
          "function"
      ) {

        return;

      }


      if (
        realtimeChannel
      ) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          )
          .catch(
            function () {}
          );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "duo-love-chat-" +
            currentCoupleId
          )
          .on(
            "postgres_changes",
            {
              event:
                "INSERT",

              schema:
                "public",

              table:
                "couple_chat_messages",

              filter:
                "couple_id=eq." +
                currentCoupleId
            },
            function (
              payload
            ) {

              if (
                payload &&
                payload.new
              ) {

                mergeMessages([
                  payload.new
                ]);


                renderMessages();

              }

            }
          )
          .subscribe(
            function (
              status
            ) {

              if (
                status ===
                "SUBSCRIBED"
              ) {

                setChatReady(
                  true,
                  "Conectat"
                );

              }

            }
          );

    }


    async function sendMessage(
      suppliedText = ""
    ) {

      if (
        sending ||
        !currentUser ||
        !currentCoupleId
      ) {

        return;

      }


      const text =
        String(
          suppliedText ||
          input.value
        )
          .trim();


      if (
        !text
      ) {

        return;

      }


      sending =
        true;


      sendButton.disabled =
        true;


      chatError.textContent =
        "";


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "couple_chat_messages"
          )
          .insert(
            {
              couple_id:
                currentCoupleId,

              sender_id:
                currentUser.id,

              body:
                text
            }
          )
          .select(
            "id,couple_id,sender_id,body,created_at"
          )
          .single();


      sending =
        false;


      sendButton.disabled =
        false;


      if (
        error
      ) {

        console.error(
          "Eroare trimitere chat:",
          error
        );


        chatError.textContent =
          "Mesajul nu a putut fi trimis.";


        return;

      }


      input.value =
        "";


      mergeMessages([
        data
      ]);


      renderMessages();

    }


    sendButton.addEventListener(
      "click",
      function () {

        sendMessage();

      }
    );


    input.addEventListener(
      "keydown",
      function (
        event
      ) {

        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    document
      .querySelectorAll(
        "[data-quick-message]"
      )
      .forEach(
        function (
          button
        ) {

          button.addEventListener(
            "click",
            function () {

              sendMessage(
                button.dataset.quickMessage
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".bottom-nav .nav-item[data-page]"
      )
      .forEach(
        function (
          button
        ) {

          button.addEventListener(
            "click",
            function () {

              window.location.href =
                "./" +
                button.dataset.page;

            }
          );

        }
      );


    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState ===
            "visible"
        ) {

          loadChatMessages(
            true
          );

        }

      }
    );


    async function startChat() {

      if (
        typeof window.applyGlobalBackground ===
        "function"
      ) {

        window.applyGlobalBackground();

      }


      if (
        typeof window.applyGlobalFont ===
        "function"
      ) {

        window.applyGlobalFont();

      }


      if (
        typeof window.loadAppDataFromCloud ===
        "function"
      ) {

        await window
          .loadAppDataFromCloud()
          .catch(
            function () {}
          );

      }


      const ready =
        await resolveChatContext();


      if (
        !ready
      ) {

        return;

      }


      await loadChatMessages();


      setChatReady(
        true,
        "Conectat"
      );


      startRealtimeChat();


      refreshTimer =
        setInterval(
          function () {

            loadChatMessages(
              true
            );

          },
          5000
        );

    }


    startChat();

  </script>


<script>
document.addEventListener("DOMContentLoaded", function(){
  setTimeout(function(){
    try{
      const draft=localStorage.getItem("duoDraftChatMessage");
      const input=document.getElementById("chatInput");

      if(draft && input){
        input.value=draft;
        localStorage.removeItem("duoDraftChatMessage");
        input.focus();
      }
    }catch(e){}
  },700);
});
</script>

</body>
