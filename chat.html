<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>Chat ❤️</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" <link rel="stylesheet" href="./style.css?v=31"> rel="stylesheet" href="./style.css?v=31">">
</head>


<body class="chat-page-body">

  <main class="app chat-app">

    <header class="chat-header">

      <span class="home-small">
        💬 MESAJE
      </span>

      <h1>
        Chat ❤️
      </h1>

      <p>
        Spațiul vostru pentru cuvinte care rămân.
      </p>

    </header>


    <section class="chat-card">

      <div
        class="chat-messages"
        id="chatMessages"
      >
      </div>


      <div class="chat-quick">

        <button
          type="button"
          data-message="Vreau să-ți spun cât de mult însemni pentru mine. ❤️"
        >
          ❤️ Mesaj romantic
        </button>

        <button
          type="button"
          data-message="Am o surpriză pentru tine. ✨"
        >
          ✨ Idee de surpriză
        </button>

        <button
          type="button"
          data-message="Îmi pare rău. Nu vreau să rămână nimic nespus între noi. 🥺"
        >
          🥺 Mesaj de împăcare
        </button>

      </div>


      <div class="chat-input-row">

        <textarea
          id="chatInput"
          placeholder="Scrie aici..."
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          type="button"
        >
          ➤
        </button>

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button type="button" class="nav-item" data-page="index.html">
      <span class="nav-icon">🏠</span>
      <span>Acasă</span>
    </button>

    <button type="button" class="nav-item" data-page="chat.html">
      <span class="nav-icon">💬</span>
      <span>Chat</span>
    </button>

    <button type="button" class="nav-item" data-page="amintiri.html">
      <span class="nav-icon">📸</span>
      <span>Amintiri</span>
    </button>

    <button type="button" class="nav-item" data-page="evenimente.html">
      <span class="nav-icon">📅</span>
      <span>Evenimente</span>
    </button>

    <button type="button" class="nav-item" data-page="setari.html">
      <span class="nav-icon">⚙️</span>
      <span>Setări</span>
    </button>

  </nav>


  <script src="./tema.js"></script>

  <script>
    const messagesBox =
      document.getElementById(
        "chatMessages"
      );

    const input =
      document.getElementById(
        "chatInput"
      );

    const send =
      document.getElementById(
        "sendButton"
      );


    let messages =
      JSON.parse(
        localStorage.getItem(
          "coupleChatMessages"
        ) || "[]"
      );


    function renderMessages() {

      messagesBox.innerHTML =
        messages
          .map(function (message) {

            return `
              <div class="chat-message user-message">
                ${escapeHtml(message.text)}
              </div>
            `;

          })
          .join("");


      messagesBox.scrollTop =
        messagesBox.scrollHeight;
    }


    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value;

      return div.innerHTML;
    }


    function sendMessage(text) {

      const value =
        (text || input.value)
          .trim();

      if (!value) return;


      messages.push({
        text: value,
        date: Date.now()
      });


      localStorage.setItem(
        "coupleChatMessages",
        JSON.stringify(messages)
      );


      input.value = "";

      renderMessages();
    }


    send.addEventListener(
      "click",
      function () {
        sendMessage();
      }
    );


    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    document
      .querySelectorAll(
        ".chat-quick button"
      )
      .forEach(function (button) {

        button.addEventListener(
          "click",
          function () {

            input.value =
              button.dataset.message;

            input.focus();

          }
        );

      });


    renderMessages();
  </script>

</body>
</html>
