<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8dcec">
<title>Alege animalul ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  min-height:100dvh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#513343;
  background:
    radial-gradient(circle at 15% 7%,rgba(255,255,255,.98),transparent 27%),
    radial-gradient(circle at 90% 13%,rgba(250,190,221,.58),transparent 28%),
    linear-gradient(180deg,#fff8fb,#f8dff1 55%,#e8eeff);
  padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 28px)
}
.page{width:min(100%,760px);margin:auto}
.header{display:flex;align-items:center;gap:12px}
.back{
  width:46px;height:46px;border:0;border-radius:50%;background:white;color:#513343;
  box-shadow:0 10px 26px rgba(79,44,63,.12);font-size:23px;cursor:pointer
}
.header small{display:block;color:#d16799;font-size:10px;font-weight:900;letter-spacing:1.5px}
.header h1{margin:3px 0 0;font-size:28px}
.tip{
  margin:15px 0 12px;padding:14px 16px;border-radius:22px;
  background:rgba(255,255,255,.68);box-shadow:0 12px 30px rgba(79,44,63,.08);
  color:#876778;font-size:12px;line-height:1.5
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pet{
  position:relative;padding:10px;border:2px solid transparent;border-radius:27px;
  background:rgba(255,255,255,.88);color:#513343;cursor:pointer;
  box-shadow:0 15px 34px rgba(79,44,63,.11)
}
.pet.selected{border-color:#f27daf;box-shadow:0 0 0 4px rgba(242,125,175,.13),0 15px 34px rgba(79,44,63,.13)}
.pic{
  height:220px;display:grid;place-items:center;overflow:hidden;border-radius:20px;
  background:linear-gradient(145deg,#fff,#f8eaf2)
}
.pic img{width:100%;height:100%;object-fit:contain;object-position:center bottom;padding:5px}
.name{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.name strong{font-size:17px}.name span{font-size:22px}
.type{display:block;margin-top:3px;color:#967486;font-size:11px}
.check{
  display:none;position:absolute;right:17px;top:17px;width:30px;height:30px;border-radius:50%;
  place-items:center;background:#ef76aa;color:#fff;font-weight:900
}
.pet.selected .check{display:grid}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:390px){.pic{height:180px}.grid{gap:9px}.pet{padding:8px}}
</style>
</head>
<body>
<main class="page">
  <div class="header">
    <button class="back" type="button" onclick="location.href='./camera-animal.html'">←</button>
    <div>
      <small>DUO LOVE ❤️</small>
      <h1>Alege animalul</h1>
    </div>
  </div>

  <div class="tip">
    Alege animalul vostru. În camera lui îl poți hrăni, spăla, culca, te poți juca, face misiuni și cumpăra mâncare.
  </div>

  <section class="grid">
    <button class="pet" data-pet="teddy" type="button">
      <span class="check">✓</span>
      <div class="pic"><img src="./ursulet.png" alt="Teddy"></div>
      <div class="name"><strong>Teddy</strong><span>🧸</span></div>
      <span class="type">Ursuleț</span>
    </button>

    <button class="pet" data-pet="dog" type="button">
      <span class="check">✓</span>
      <div class="pic"><img src="./animal-dog-real.png" alt="Mochi"></div>
      <div class="name"><strong>Mochi</strong><span>🐶</span></div>
      <span class="type">Cățeluș</span>
    </button>

    <button class="pet" data-pet="cat" type="button">
      <span class="check">✓</span>
      <div class="pic"><img src="./animal-cat-real.png" alt="Luna"></div>
      <div class="name"><strong>Luna</strong><span>🐱</span></div>
      <span class="type">Pisicuță</span>
    </button>
  </section>
</main>

<script>
(function(){
  const KEY="duoSelectedPet";
  const cards=[...document.querySelectorAll(".pet")];

  function refresh(){
    const selected=localStorage.getItem(KEY)||"teddy";
    cards.forEach(card=>{
      card.classList.toggle("selected",card.dataset.pet===selected);
    });
  }

  cards.forEach(card=>{
    card.addEventListener("click",()=>{
      localStorage.setItem(KEY,card.dataset.pet);
      refresh();
      if(navigator.vibrate) navigator.vibrate(35);
      setTimeout(()=>location.href="./camera-animal.html",180);
    });
  });

  refresh();
})();
</script>
</body>
</html>
