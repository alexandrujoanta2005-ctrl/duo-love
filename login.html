<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#100b17">

  <title>Our Space ❤️</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


  <main class="login-container">


    <div class="login-logo">
      ❤️
    </div>


    <p class="login-small">
      SPAȚIUL VOSTRU
    </p>


    <h1 class="login-title">
      Povestea voastră
    </h1>


    <p class="login-description">
      Amintiri, mesaje și momente speciale,
      într-un singur loc doar pentru voi.
    </p>



    <div class="login-card">


      <!-- GOOGLE -->

      <button
        id="googleLogin"
        class="login-provider google-login"
      >

        <span class="provider-icon">
          G
        </span>

        <span>
          Continuă cu Google
        </span>

      </button>



      <!-- APPLE -->

      <button
        id="appleLogin"
        class="login-provider apple-login"
      >

        <span class="provider-icon apple-icon">
          
        </span>

        <span>
          Continuă cu Apple
        </span>

      </button>



      <div class="login-divider">

        <span></span>

        <p>
          sau
        </p>

        <span></span>

      </div>



      <!-- GUEST -->

      <button
        id="guestLogin"
        class="login-provider guest-login"
      >

        <span>
          👤
        </span>

        <span>
          Continuă ca Guest
        </span>

      </button>



      <!-- LOADING -->

      <p
        id="loginStatus"
        class="login-status"
      ></p>


    </div>



    <div class="login-security">

      🔒

      <span>
        Spațiul vostru privat
      </span>

    </div>


    <p class="login-footer">

      Continuând, datele aplicației vor putea
      fi asociate contului tău.

    </p>


  </main>



  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="login.js"></script>


</body>

</html>
