<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7dced">
<title>Misiunile animalului 📋</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#503440;background:linear-gradient(180deg,#fff7fb,#f7dcec 52%,#e8ecff);
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)
}
.page{width:min(100%,760px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:9px}.group{display:flex;gap:7px;align-items:center}
.back,.wallet{min-height:45px;border:0;border-radius:16px;background:#fff;color:#503440;box-shadow:0 8px 22px rgba(80,47,64,.09)}.back{width:46px;font-size:21px;cursor:pointer}.wallet{padding:0 11px;display:flex;gap:6px;align-items:center;font-weight:900}
h1{margin:16px 2px 4px;font-size:29px}.sub{margin:0 2px 13px;color:#937180;font-size:12px;line-height:1.5}
.list{display:grid;gap:10px}.mission{padding:13px;border-radius:23px;background:rgba(255,255,255,.88);box-shadow:0 12px 28px rgba(80,47,64,.09);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:11px;align-items:center}
.icon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:#fff1f7;font-size:26px}
.copy strong{display:block;font-size:13px}.reward{display:block;margin-top:4px;color:#9c7185;font-size:10px}.progress-row{display:flex;align-items:center;gap:7px;margin-top:8px}.bar{height:9px;flex:1;border-radius:999px;background:#eee1e8;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#f18aae,#d96d9d);border-radius:inherit}.count{font-size:10px;font-weight:900;white-space:nowrap}
.claim{min-width:88px;border:0;border-radius:14px;padding:10px 10px;background:linear-gradient(135deg,#ef81a7,#d95e91);color:#fff;font-weight:900;cursor:pointer}.claim:disabled{background:#d9c8cf;color:#fff;cursor:default}.claim.done{background:#7bbf83}
.summary{margin-top:12px;padding:14px;border-radius:21px;background:rgba(255,255,255,.75);text-align:center;color:#8d6779;font-size:12px;line-height:1.5}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.nav a{padding:13px;border-radius:17px;background:#fff;text-align:center;text-decoration:none;color:#8c5872;font-weight:900;box-shadow:0 8px 20px rgba(80,47,64,.07)}
.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,20px);padding:11px 15px;border-radius:16px;background:#4c3440;color:#fff;font-size:12px;font-weight:800;opacity:0;transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:500px){.mission{grid-template-columns:46px minmax(0,1fr)}.icon{width:46px;height:46px}.claim{grid-column:2;width:100%}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="group">
      <button class="back" type="button" onclick="location.href='./camera-animal.html'">←</button>
      <div class="wallet">🪙 <span id="coins">0</span></div>
    </div>
    <div class="wallet">💗 <span id="hearts">0</span></div>
  </header>

  <h1>Misiuni zilnice 📋</h1>
  <p class="sub">Fă activități cu animalul, termină misiunile și ia monede pentru magazin. Misiunile se resetează în fiecare zi.</p>

  <section id="missionList" class="list"></section>

  <div id="summary" class="summary">0 / 6 misiuni terminate</div>

  <section class="nav">
    <a href="./camera-animal.html">🐾 Camera</a>
    <a href="./magazin-animal.html">🛒 Magazin</a>
  </section>
</main>
<div id="toast" class="toast">Recompensă primită ✅</div>

<script src="./pet-system.js"></script>
<script>
(function(){
  const list=document.getElementById("missionList");
  const toast=document.getElementById("toast");
  let timer;

  function show(text){
    clearTimeout(timer);
    toast.textContent=text;
    toast.classList.add("show");
    timer=setTimeout(()=>toast.classList.remove("show"),2300);
  }

  function render(){
    // Dacă animalul este bine îngrijit, misiunea de grijă se completează.
    const key=DuoPet.selectedPet();
    const stats=DuoPet.getStats(key);
    DuoPet.recordCareIfEligible(stats);

    const state=DuoPet.getMissionState();
    list.innerHTML="";
    let completed=0;

    DuoPet.MISSION_DEFS.forEach(def=>{
      const progress=Math.min(def.goal,Number(state.progress[def.id]||0));
      const done=progress>=def.goal;
      const claimed=Boolean(state.claimed[def.id]);
      if(done) completed++;

      const card=document.createElement("article");
      card.className="mission";
      card.innerHTML=`
        <div class="icon">${def.icon}</div>
        <div class="copy">
          <strong>${def.title}</strong>
          <span class="reward">Recompensă: 🪙 ${def.coins} + 💗 ${def.hearts}</span>
          <div class="progress-row">
            <div class="bar"><div class="fill" style="width:${Math.min(100,(progress/def.goal)*100)}%"></div></div>
            <span class="count">${progress} / ${def.goal}</span>
          </div>
        </div>
        <button class="claim ${claimed?"done":""}" data-id="${def.id}" ${(!done||claimed)?"disabled":""}>
          ${claimed?"Luată ✅":done?"Colectează":"În lucru"}
        </button>
      `;
      list.appendChild(card);
    });

    document.getElementById("summary").textContent=completed+" / "+DuoPet.MISSION_DEFS.length+" misiuni terminate";
    document.getElementById("coins").textContent=DuoPet.getCoins();
    document.getElementById("hearts").textContent=DuoPet.getHearts();

    document.querySelectorAll(".claim").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const result=DuoPet.claimMission(btn.dataset.id);
        show(result.message);
        if(result.ok && navigator.vibrate) navigator.vibrate(45);
        render();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
