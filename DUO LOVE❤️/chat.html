    /* ======================================================
       ELEMENTE
    ====================================================== */

    const messagesBox =
      document.getElementById(
        "chatMessages"
      );

      );

    /* ======================================================
       AUTENTIFICARE
    ====================================================== */

    async function checkAuthentication() {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {
        return false;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (
          error ||
          !data ||
          !data.session
        ) {

          window.location.href =
            "./login.html";

          return false;
        }


        return true;

      } catch (error) {

        console.error(
          "Eroare autentificare:",
          error
        );


        return false;

      }

    }



    /* ======================================================
       CITEȘTE MESAJELE DUPĂ SINCRONIZARE
    ====================================================== */

    function loadMessages() {

      try {

        messages =
          JSON.parse(
            localStorage.getItem(
              "coupleChatMessages"
            ) ||
            "[]"
          );

      } catch (error) {

        messages = [];

      }


      if (
        !Array.isArray(messages)
      ) {

        messages = [];

      }


      /*
        Convertim și mesajele mai vechi
        în formatul nou.
      */

      messages =
        messages.map(
          function (message) {

            return {

              role:
                message.role ||
                "user",

              text:
                message.text ||
                "",

              type:
                message.type ||
                "normal",

              date:
                message.date ||
                Date.now()

            };

          }
        );


      /*
        Păstrăm maximum 80 mesaje.
      */

      if (
        messages.length >
        80
      ) {

        messages =
          messages.slice(
            -80
          );

      }


      /*
        Mesaj de bun venit
        doar dacă nu există nimic.
      */

      if (
        !messages.length
      ) {

        messages.push({

          role:
            "assistant",

          type:
            "normal",

          text:
            "Bună ❤️ Sunt Asistentul iubirii. 💕\n\nPot să te ajut cu mesaje romantice, scrisori lungi de iubire 💌, împăcare, aniversări, surprize și cuvinte frumoase pentru persoana iubită. 🥰",

          date:
            Date.now()

        });


        saveMessages();

      }

    }



    /* ======================================================
       SALVARE LOCAL + CONT SUPABASE
    ====================================================== */

    function saveMessages() {

      if (
        messages.length >
        80
      ) {

        messages =
          messages.slice(
            -80
          );

      }


      /*
        Dacă cloud-sync.js este încărcat,
        salvăm și local și pe cont.
      */

      if (
        typeof window.saveJSON ===
        "function"
      ) {

        window.saveJSON(
          "coupleChatMessages",
          messages
        );

      } else {

        localStorage.setItem(
          "coupleChatMessages",
          JSON.stringify(messages)
        );

      }

    }



    /* ======================================================
       RANDARE
    ====================================================== */

    function renderMessages() {

      messagesBox.innerHTML =
        "";


      messages.forEach(
        function (message) {


          const bubble =
            document.createElement(
              "div"
            );


          bubble.classList.add(
            "chat-message"
          );


          if (
            message.role ===
            "assistant"
          ) {

            bubble.classList.add(
              "assistant-message"
            );

          } else {

            bubble.classList.add(
              "user-message"
            );

          }


          if (
            message.type ===
            "letter"
          ) {

            bubble.classList.add(
              "love-letter"
            );

          }


          bubble.textContent =
            message.text;


          messagesBox.appendChild(
            bubble
          );

        }
      );


      scrollMessagesToBottom();

    }



    function scrollMessagesToBottom() {

      requestAnimationFrame(
        function () {

          messagesBox.scrollTop =
            messagesBox.scrollHeight;

        }
      );

    }



    /* ======================================================
       NORMALIZARE TEXT
    ====================================================== */

    function normalizeText(text) {

      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }



    /* ======================================================
       ALEGERE ALEATORIE
    ====================================================== */

    function randomFrom(array) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];

    }

      "🎁 Idee de surpriză: pregătește o seară doar pentru voi. ❤️ Pune melodiile voastre preferate 🎶, câteva poze cu amintiri 📸, ceva bun de mâncat și scrie de mână o scrisoare în care să spui ce iubești cel mai mult la persoana ta. 💌✨",

      "✨ Fă o cutie cu amintiri: pune câteva poze, bilețele cu momentele voastre preferate și câteva motive pentru care o/o iubești. ❤️ La final adaugă un bilețel: «Asta este doar începutul poveștii noastre.» 🥹💕",

      "🌹 Poți pregăti o surpriză simplă: o plimbare seara, melodia voastră preferată, un loc liniștit și un mesaj scris special pentru ea/el. Uneori cele mai frumoase surprize nu sunt cele scumpe, ci cele făcute cu suflet. ❤️"

    ];



    /* ======================================================
       GENERARE RĂSPUNS
    ====================================================== */

    function generateAssistantReply(
      userText
    ) {

      const text =
        normalizeText(
          userText
        );


      if (
        text.includes("scrisoare") ||
        text.includes("scrisoare de iubire")
      ) {

        return {
          text:
            randomFrom(
              loveLetters
            ),

          type:
            "letter"
        };

      }


      if (
        text.includes("impac") ||
        text.includes("iertare") ||
        text.includes("scuze") ||
        text.includes("cearta")
      ) {

        return {
          text:
            randomFrom(
              reconciliationMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("noapte buna") ||
        text.includes("somn")
      ) {

        return {
          text:
            randomFrom(
              goodNightMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("buna dimineata") ||
        text.includes("neata")
      ) {

        return {
          text:
            randomFrom(
              morningMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("dor") ||
        text.includes("mi-e dor")
      ) {

        return {
          text:
            randomFrom(
              missingMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("anivers") ||
        text.includes("la multi ani")
      ) {

        return {
          text:
            randomFrom(
              anniversaryMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("surpriza") ||
        text.includes("cadou") ||
        text.includes("idee")
      ) {

        return {
          text:
            randomFrom(
              surprises
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("romantic") ||
        text.includes("mesaj") ||
        text.includes("iubire") ||
        text.includes("te iubesc")
      ) {

        return {
          text:
            randomFrom(
              romanticMessages
            ),

          type:
            "normal"
        };

      }


      if (
        text.includes("ce faci")
      ) {

        return {
          text:
            "Sunt aici cu tine. ❤️ Spune-mi ce ai nevoie: un mesaj romantic, o scrisoare lungă de iubire 💌, o idee de surpriză 🎁 sau poate vrei să reparăm o ceartă. 🥹💕",

          type:
            "normal"
        };

      }


      if (
        text.includes("salut") ||
        text.includes("buna") ||
        text === "hei"
      ) {

        return {
          text:
            "Bună ❤️💕 Cu ce te ajut astăzi? Pot să-ți scriu o scrisoare lungă de iubire 💌, un mesaj romantic 🥹, ceva pentru aniversare 🎉 sau o surpriză frumoasă. ✨",

          type:
            "normal"
        };

      }


      return {

        text:
          "Pot să transform ceea ce simți într-un mesaj frumos. ❤️\n\nPoți să-mi scrii, de exemplu:\n\n💌 „Fă-mi o scrisoare lungă de iubire”\n❤️ „Mesaj romantic”\n🥺 „Vreau să-mi cer iertare”\n🌙 „Mesaj de noapte bună”\n🥹 „Mi-e dor de ea/el”\n🎉 „Mesaj pentru aniversare”\n🎁 „Dă-mi o idee de surpriză”",

        type:
          "normal"
      };

    }



    /* ======================================================
       RĂSPUNS ASISTENT
    ====================================================== */

    function assistantReply(
      userText
    ) {

      const typing =
        document.createElement(
          "div"
        );


      typing.className =
        "chat-message assistant-message typing-message";


      typing.textContent =
        "Scriu ceva frumos... 💕";


      messagesBox.appendChild(
        typing
      );


      scrollMessagesToBottom();


      setTimeout(
        function () {

          typing.remove();


          const answer =
            generateAssistantReply(
              userText
            );


          messages.push({

            role:
              "assistant",

            text:
              answer.text,

            type:
              answer.type,

            date:
              Date.now()

          });


          saveMessages();

          renderMessages();

        },
        650
      );

    }



    /* ======================================================
       TRIMITERE
    ====================================================== */

    function sendMessage(
      suppliedText
    ) {

      const value =
        (
          suppliedText ||
          input.value
        ).trim();


      if (
        !value
      ) {
        return;
      }


      messages.push({

        role:
          "user",

        text:
          value,

        type:
          "normal",

        date:
          Date.now()

      });


      /*
        Se salvează imediat și în cloud.
      */

      saveMessages();


      input.value =
        "";


      renderMessages();


      assistantReply(
        value
      );

    }



    /* ======================================================
       BUTON TRIMITE
    ====================================================== */

    sendButton.addEventListener(
      "click",
      function () {

        sendMessage();

      }
    );



    /* ======================================================
       ENTER
    ====================================================== */

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );



    /* ======================================================
       BUTOANE RAPIDE
    ====================================================== */

    document
      .querySelectorAll(
        ".chat-quick button"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              const prompt =
                button.dataset.prompt;


              sendMessage(
                prompt
              );

            }
          );

        }
      );



    /* ======================================================
       PORNIRE CHAT + CLOUD
    ====================================================== */

    async function startChat() {

      /*
        1. Verificăm utilizatorul.
      */

      const authenticated =
        await checkAuthentication();


      if (
        !authenticated
      ) {

        return;

      }


      /*
        2. Descărcăm conversația și
        restul datelor de pe cont.
      */

      if (
        typeof window.loadAppDataFromCloud ===
        "function"
      ) {

        await window
          .loadAppDataFromCloud();

      }


      /*
        3. Reaplicăm fundalul/fontul
        după sincronizare.
      */

      if (
        typeof window.applyGlobalBackground ===
        "function"
      ) {

        window.applyGlobalBackground();

      }


      if (
        typeof window.applyGlobalFont ===
        "function"
      ) {

        window.applyGlobalFont();

      }


      /*
        4. Citim conversația după cloud.
      */

      loadMessages();


      /*
        5. Afișăm conversația.
      */

      renderMessages();

    }



    /* ======================================================
       SALVARE CÂND APLICAȚIA ESTE ASCUNSĂ
    ====================================================== */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          if (
            typeof window.saveAppDataToCloud ===
            "function"
          ) {

            window.saveAppDataToCloud();

          }

        }

      }
    );



    /* ======================================================
       START
    ====================================================== */

    startChat();

  </script>


</body>
