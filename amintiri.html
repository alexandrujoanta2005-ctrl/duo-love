    /* =========================================

    body.memories-page {

    }

        12px;

        border-box;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.10
        );

      border-radius:
        17px;

      background:
        rgba(
          112,
          38,
          77,
          0.62
        );

      color:
        #ffffff;

      font-size:
        16px;

      text-align:
        center;

      cursor:
        pointer;
    }


    .add-memory-button.uploading {
      opacity:
        0.7;

      pointer-events:
        none;
    }


    /* =========================================
       GRID
    ========================================= */

    .memories-grid {
      display:
        grid;

      grid-template-columns:
        1fr;

      gap:
        14px;

      width:
        100%;
    }


    /* =========================================
       CARD
    ========================================= */

    .memory-card {
      overflow:
        hidden;

      width:
        100%;

      border-radius:
        23px;

      background:
        rgba(
          14,
          9,
          18,
          0.84
        ) !important;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.09
        ) !important;

      color:
        #ffffff !important;

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    .memory-card img {
      display:
        block;

      width:
        100%;

      height:
        240px;

      object-fit:
        cover;

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );
    }


    .memory-info {
      padding:
        15px;
    }


    .memory-info h2 {
      margin:
        0
        0
        6px;

      font-size:
        20px;

      color:
        #ffffff;
    }


    .memory-info p {
      margin:
        0;

      color:
        rgba(
          255,
          255,
          255,
          0.65
        );
    }


    /* =========================================
       FĂRĂ AMINTIRI
    ========================================= */

    .memory-empty {
      padding:

        center;
    }


    .memory-empty-icon {
      display:

      margin-bottom:

    }


    .memory-empty h2 {

        0

    }

        rgba(

    /* =========================================
       ȘTERGE
    ========================================= */

    .delete-memory {

        );

        );

    /* =========================================

      width:
        100% !important;

      max-width:
        none !important;

      margin:
        0 !important;

      transform:
        none !important;

      z-index:
        2147483647 !important;
    }

  </style>

  <!-- =========================================
       SCRIPTURI
  ========================================= -->

 <script 
 src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js?v=31"></script>
<script src="./security.js?v=32"></script>

  <script src="./cloud-sync.js"></script>

  <script>

    /* =========================================
       CONFIG
    ========================================= */

    const STORAGE_BUCKET =
      "love-media";


    const memoriesGrid =
      document.getElementById(
        "memoriesGrid"
      );


    const memoryInput =
      document.getElementById(
        "memoryInput"
      );


    const addMemoryButton =
      document.getElementById(
        "addMemoryButton"
      );



    /* =========================================
       UTILIZATOR
    ========================================= */

    async function getCurrentUser() {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        return null;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (
        error ||
        !data ||
        !data.session
      ) {

        return null;

      }


      return data.session.user;

    }



    /* =========================================
       AUTENTIFICARE
    ========================================= */

    async function checkAuthentication() {

      const user =
        await getCurrentUser();


      if (
        !user
      ) {

        window.location.href =
          "./login.html";

        return false;

      }


      return true;

    }



    /* =========================================
       CITEȘTE AMINTIRILE
    ========================================= */

    function getMemories() {

      try {

        const memories =
          JSON.parse(
            localStorage.getItem(
              "loveMemories"
            ) ||
            "[]"
          );


        return Array.isArray(
          memories
        )
          ? memories
          : [];

      } catch (error) {

        return [];

      }

    }



    /* =========================================
       SALVARE LOCAL + CLOUD
    ========================================= */

    function saveMemories(
      memories
    ) {

      if (
        typeof window.saveJSON ===
        "function"
      ) {

        window.saveJSON(
          "loveMemories",
          memories
        );

      } else {

        localStorage.setItem(
          "loveMemories",
          JSON.stringify(
            memories
          )
        );

      }

    }



    /* =========================================
       ID UNIC
    ========================================= */

    function createId() {

      if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"
      ) {

        return window.crypto
          .randomUUID();

      }


      return (
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2)
      );

    }



    /* =========================================
       COMPRIMĂ POZA
       RETURNĂM BLOB JPEG
    ========================================= */

    function compressImage(
      file
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          const reader =
            new FileReader();


          reader.onerror =
            function () {

              reject(
                new Error(
                  "Nu am putut citi poza."
                )
              );

            };


          reader.onload =
            function (event) {

              const image =
                new Image();


              image.onerror =
                function () {

                  reject(
                    new Error(
                      "Nu am putut deschide poza."
                    )
                  );

                };


              image.onload =
                function () {

                  const maxSize =
                    1400;


                  const scale =
                    Math.min(
                      1,
                      maxSize /
                      Math.max(
                        image.width,
                        image.height
                      )
                    );


                  const canvas =
                    document.createElement(
                      "canvas"
                    );


                  canvas.width =
                    Math.round(
                      image.width *
                      scale
                    );


                  canvas.height =
                    Math.round(
                      image.height *
                      scale
                    );


                  const context =
                    canvas.getContext(
                      "2d"
                    );


                  context.drawImage(
                    image,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                  );


                  canvas.toBlob(
                    function (blob) {

                      if (
                        !blob
                      ) {

                        reject(
                          new Error(
                            "Poza nu a putut fi procesată."
                          )
                        );

                        return;

                      }


                      resolve(
                        blob
                      );

                    },
                    "image/jpeg",
                    0.78
                  );

                };


              image.src =
                event.target.result;

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }



    /* =========================================
       UPLOAD ÎN SUPABASE STORAGE
    ========================================= */

    async function uploadMemoryBlob(
      blob
    ) {

      const user =
        await getCurrentUser();


      if (
        !user
      ) {

        throw new Error(
          "Nu ești conectat."
        );

      }


      const id =
        createId();


      const storagePath =
        user.id +
        "/memories/" +
        Date.now() +
        "-" +
        id +
        ".jpg";


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .upload(
            storagePath,
            blob,
            {
              contentType:
                "image/jpeg",

              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (
        error
      ) {

        throw error;

      }


      return {
        id:
          id,

        storagePath:
          storagePath
      };

    }



    /* =========================================
       URL TEMPORAR SECURIZAT
    ========================================= */

    async function getMemoryImageUrl(
      memory
    ) {

      /*
        POZE VECHI SALVATE LOCAL
      */

      if (
        memory.image
      ) {

        return memory.image;

      }


      /*
        POZE NOI DIN STORAGE
      */

      if (
        !memory.storagePath
      ) {

        return "";

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .createSignedUrl(
            memory.storagePath,
            60 * 60
          );


      if (
        error ||
        !data
      ) {

        console.error(
          "Nu pot încărca poza:",
          error
        );

        return "";

      }


      return data.signedUrl;

    }



    /* =========================================
       RANDARE
    ========================================= */

    async function renderMemories() {

      const memories =
        getMemories();


      memoriesGrid.innerHTML =
        "";


      if (
        !memories.length
      ) {

        memoriesGrid.innerHTML = `

          <article
            class="memory-card memory-empty"
          >

            <span class="memory-empty-icon">
              📷
            </span>

            <h2>
              Încă nu ai adăugat nicio amintire.
            </h2>

            <p>
              Apasă pe „Adaugă o poză” ❤️
            </p>

          </article>

        `;


        return;

      }


      for (
        let index = 0;
        index < memories.length;
        index++
      ) {

        const memory =
          memories[index];


        const imageUrl =
          await getMemoryImageUrl(
            memory
          );


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "memory-card";


        const image =
          document.createElement(
            "img"
          );


        image.alt =
          "Amintirea noastră";


        image.draggable =
          false;


        if (
          imageUrl
        ) {

          image.src =
            imageUrl;

        }


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "memory-info";


        const title =
          document.createElement(
            "h2"
          );


        title.textContent =
          "❤️ Amintirea noastră";


        const date =
          document.createElement(
            "p"
          );


        date.textContent =
          memory.date ||
          "";


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.type =
          "button";


        deleteButton.className =
          "delete-memory";


        deleteButton.textContent =
          "🗑 Șterge";


        deleteButton.addEventListener(
          "click",
          async function () {

            await deleteMemory(
              memory.id,
              memory.storagePath
            );

          }
        );


        info.appendChild(
          title
        );


        info.appendChild(
          date
        );


        info.appendChild(
          deleteButton
        );


        card.appendChild(
          image
        );


        card.appendChild(
          info
        );


        memoriesGrid.appendChild(
          card
        );

      }

    }



    /* =========================================
       ȘTERGE AMINTIRE
    ========================================= */

    async function deleteMemory(
      id,
      storagePath
    ) {

      const memories =
        getMemories();


      const memory =
        memories.find(
          function (item) {

            return (
              item.id === id
            );

          }
        );


      /*
        Dacă e poză din Storage,
        o ștergem și de acolo.
      */

      if (
        storagePath
      ) {

        const {
          error
        } =
          await supabaseClient
            .storage
            .from(
              STORAGE_BUCKET
            )
            .remove([
              storagePath
            ]);


        if (
          error
        ) {

          console.error(
            "Eroare ștergere Storage:",
            error
          );


          alert(
            "Nu am putut șterge poza din cont."
          );


          return;

        }

      }


      const updated =
        memories.filter(
          function (item) {

            /*
              Pentru amintirile foarte vechi
              fără ID folosim referința obiectului.
            */

            if (
              id
            ) {

              return (
                item.id !== id
              );

            }


            return (
              item !== memory
            );

          }
        );


      saveMemories(
        updated
      );


      if (
        typeof window.saveAppDataToCloud ===
        "function"
      ) {

        await window
          .saveAppDataToCloud();

      }


      await renderMemories();

    }



    /* =========================================
       ADAUGĂ POZĂ
    ========================================= */

    memoryInput.addEventListener(
      "change",
      async function () {

        const file =
          this.files &&
          this.files[0];


        if (
          !file
        ) {

          return;

        }


        addMemoryButton.classList.add(
          "uploading"
        );


        addMemoryButton.textContent =
          "⏳ Se salvează pe cont...";


        try {

          /*
            1. comprimăm poza
          */

          const blob =
            await compressImage(
              file
            );


          /*
            2. o urcăm în Storage
          */

          const uploaded =
            await uploadMemoryBlob(
              blob
            );


          /*
            3. salvăm doar informațiile
            despre poză în cont
          */

          const memories =
            getMemories();


          memories.unshift({

            id:
              uploaded.id,

            storagePath:
              uploaded.storagePath,

            date:
              new Date()
                .toLocaleDateString(
                  "ro-RO",
                  {
                    day:
                      "numeric",

                    month:
                      "long",

                    year:
                      "numeric"
                  }
                ),

            createdAt:
              new Date()
                .toISOString()

          });


          saveMemories(
            memories
          );


          /*
            4. forțăm salvarea
            metadatelor în user_app_data
          */

          if (
            typeof window.saveAppDataToCloud ===
            "function"
          ) {

            await window
              .saveAppDataToCloud();

          }


          /*
            5. afișăm
          */

          await renderMemories();


        } catch (error) {

          console.error(
            "Eroare adăugare amintire:",
            error
          );


          alert(
            "Nu am putut salva poza pe cont. Verifică internetul și Supabase."
          );

        }


        addMemoryButton.classList.remove(
          "uploading"
        );


        addMemoryButton.textContent =
          "📷 + Adaugă o poză";


        this.value =
          "";

      }
    );



    /* =========================================
       MIGRARE POZE VECHI
       DIN LOCALSTORAGE ÎN STORAGE
    ========================================= */

    async function migrateOldMemories() {

      const memories =
        getMemories();


      if (
        !memories.length
      ) {

        return;

      }


      let changed =
        false;


      const migrated =
        [];


      for (
        const memory of memories
      ) {

        /*
          Dacă e deja în Storage,
          nu facem nimic.
        */

        if (
          memory.storagePath
        ) {

          migrated.push(
            memory
          );

          continue;

        }


        /*
          Dacă este o poză veche base64,
          o urcăm automat în cont.
        */

        if (
          memory.image &&
          memory.image.startsWith(
            "data:image"
          )
        ) {

          try {

            const response =
              await fetch(
                memory.image
              );


            const blob =
              await response.blob();


            const uploaded =
              await uploadMemoryBlob(
                blob
              );


            migrated.push({

              id:
                uploaded.id,

              storagePath:
                uploaded.storagePath,

              date:
                memory.date ||
                new Date()
                  .toLocaleDateString(
                    "ro-RO"
                  ),

              createdAt:
                memory.createdAt ||
                new Date()
                  .toISOString()

            });


            changed =
              true;


          } catch (error) {

            console.error(
              "Nu am putut migra o poză veche:",
              error
            );


            /*
              O păstrăm local dacă uploadul
              nu a reușit.
            */

            migrated.push(
              memory
            );

          }


          continue;

        }


        migrated.push(
          memory
        );

      }


      if (
        changed
      ) {

        saveMemories(
          migrated
        );


        if (
          typeof window.saveAppDataToCloud ===
          "function"
        ) {

          await window
            .saveAppDataToCloud();

        }

      }

    }



    /* =========================================
       START AMINTIRI
    ========================================= */

    async function startMemories() {

      /*
        1. autentificare
      */

      const authenticated =
        await checkAuthentication();


      if (
        !authenticated
      ) {

        return;

      }


      /*
        2. luăm datele de pe cont
      */

      if (
        typeof window.loadAppDataFromCloud ===
        "function"
      ) {

        await window
          .loadAppDataFromCloud();

      }


      /*
        3. reaplicăm tema și fontul
      */

      if (
        typeof window.applyGlobalBackground ===
        "function"
      ) {

        window
          .applyGlobalBackground();

      }


      if (
        typeof window.applyGlobalFont ===
        "function"
      ) {

        window
          .applyGlobalFont();

      }


      /*
        4. mutăm automat eventualele
        poze vechi din telefon în Storage
      */

      await migrateOldMemories();


      /*
        5. afișăm amintirile
      */

      await renderMemories();

    }



    /* =========================================
       START
    ========================================= */

    startMemories();

  </script>


</body>

</html>
