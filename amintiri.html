<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09070d">
<link rel="stylesheet" href="./style.css?v=54">
<title>Amintiri ❤️</title>
<style>

:root{
  --bg:#09070d;
  --panel:rgba(22,12,25,.86);
  --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10);
  --text:#fff7fb;
  --muted:rgba(255,235,246,.64);
  --pink:#e25291;
  --pink2:#f18fbd;
  --purple:#8a5bd3;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 18% 15%,rgba(226,77,142,.24),transparent 32%),
    radial-gradient(circle at 84% 28%,rgba(116,83,221,.22),transparent 34%),
    linear-gradient(160deg,#08070d,#190d19 55%,#09070d);
  background-attachment:fixed;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
.page{width:min(100%,760px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.back{
  flex:0 0 46px;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;
  background:rgba(255,255,255,.07);color:white;font-size:22px;cursor:pointer
}
.kicker{display:block;color:#ef91bd;font-size:10px;font-weight:950;letter-spacing:1.5px}
h1{margin:3px 0 0;font-size:28px;line-height:1.1}
.card,.empty,.memory,.event{
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 14px 34px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}
.card{margin-top:12px;padding:14px;border-radius:25px}
.card h2{margin:0 0 5px;font-size:18px}
.muted{color:var(--muted);font-size:11px;line-height:1.5}
.field{margin-top:10px}
.field label{display:block;margin-bottom:5px;color:#ef91bd;font-size:10px;font-weight:900}
.field input,.field textarea,.field select{
  width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:15px;
  outline:none;background:rgba(7,6,12,.66);color:white
}
.field textarea{min-height:100px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,240,247,.42)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary,.secondary,.danger{
  min-height:44px;border:0;border-radius:14px;padding:10px 12px;font-weight:900;cursor:pointer
}
.primary{background:linear-gradient(135deg,#df4f91,#8a58d3);color:white}
.secondary{border:1px solid var(--line);background:rgba(255,255,255,.07);color:white}
.danger{background:rgba(225,87,101,.13);color:#ffb9c0;border:1px solid rgba(225,87,101,.18)}
.empty{margin-top:12px;padding:28px 16px;border-radius:24px;text-align:center;color:var(--muted)}
.empty span{display:block;font-size:40px;margin-bottom:6px}
.toast{
  position:fixed;z-index:300;left:50%;bottom:100px;transform:translate(-50%,18px);
  max-width:calc(100% - 30px);padding:11px 15px;border:1px solid var(--line);border-radius:16px;
  background:rgba(15,9,18,.96);color:#fff;font-size:12px;font-weight:850;text-align:center;
  opacity:0;transition:.2s ease;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom-nav{
  position:fixed;z-index:100;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(calc(100% - 20px),760px);
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;
  border:1px solid var(--line);border-radius:22px;background:rgba(12,8,16,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 32px rgba(0,0,0,.34)
}
.bottom-nav a{min-width:0;padding:7px 2px;border-radius:15px;color:rgba(255,240,247,.60);text-decoration:none;text-align:center;font-size:9px}
.bottom-nav a span{display:block}
.bottom-nav .ico{font-size:19px;margin-bottom:2px}
.bottom-nav a.active{background:rgba(226,77,142,.16);color:white}
@media(max-width:500px){.two{grid-template-columns:1fr}}

.album-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 7px;scrollbar-width:none}
.album-row::-webkit-scrollbar{display:none}
.album-btn{
  flex:0 0 auto;min-width:100px;padding:10px 12px;border:1px solid var(--line);border-radius:17px;
  background:rgba(255,255,255,.06);color:white;text-align:left;cursor:pointer
}
.album-btn strong{display:block;font-size:11px}
.album-btn span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.album-btn.active{border-color:rgba(239,145,189,.42);background:rgba(226,77,142,.17)}
.memory-list{display:grid;gap:11px;margin-top:12px}
.memory{overflow:hidden;border-radius:25px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:rgba(255,255,255,.04)}
.photos.one{grid-template-columns:1fr}
.photo-wrap{position:relative;min-width:0}
.photos img{width:100%;height:165px;display:block;object-fit:cover}
.more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(34,17,29,.52);font-size:24px;font-weight:950;color:white}
.copy{padding:13px}
.copy h3{margin:0;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--muted);font-size:9px}
.copy p{margin:8px 0 0;color:rgba(255,235,246,.72);font-size:11px;line-height:1.5;white-space:pre-wrap}
.actions{display:flex;gap:7px;margin-top:10px}
.actions button{flex:1}
.file-note{margin-top:6px;color:var(--muted);font-size:10px}
.modal{
  position:fixed;z-index:500;inset:0;display:none;align-items:flex-end;justify-content:center;
  padding:15px;background:rgba(20,10,17,.72);backdrop-filter:blur(8px)
}
.modal.open{display:flex}
.modal-card{
  width:min(100%,720px);max-height:88dvh;overflow:auto;padding:14px;border:1px solid var(--line);
  border-radius:28px 28px 20px 20px;background:#140c17;color:white;box-shadow:0 25px 70px rgba(0,0,0,.42)
}
.viewer{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:10px}
.viewer img{flex:0 0 92%;height:390px;object-fit:contain;border-radius:18px;background:#0d0910;scroll-snap-align:center}
@media(max-width:500px){.photos img{height:135px}.viewer img{height:320px}}

/* v55: formular compact + texte lungi sigure pe mobil */
.page{padding:0 0 calc(92px + env(safe-area-inset-bottom))}
.copy h3,.copy p{overflow-wrap:anywhere;word-break:break-word}
.memory-text-preview{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;
  max-height:7.6em;
}
.field textarea{max-height:220px}
@media(max-width:500px){
  h1{font-size:23px}.card{padding:12px;border-radius:20px}.card h2{font-size:16px}
  .field input,.field textarea,.field select{font-size:16px;min-height:44px}
  .field textarea{min-height:86px}
  .page{padding-left:10px;padding-right:10px}
}
</style>

<style id="duo-theme-sync-v49">
html{
  background:#08070d;
}

/*
  IMPORTANT:
  Fundalul real NU mai este stabilit de această pagină.
  El vine din style.css + tema.js, exact ca pe Home, Chat și Setări.
*/
body.bg-aurora,
body.bg-mesh,
body.bg-starlight,
body.bg-silk,
body.bg-plain,
body.bg-nature,
body.bg-stars,
body.bg-moon,
body.bg-clouds,
body.bg-cozy,
body.bg-pastel,
body.bg-dark,
body.bg-custom{
  min-height:100vh;
  min-height:100dvh;
}
</style>


<style id="duo-love-ai-bottom-nav-v52">
.bottom-nav{
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  gap:3px !important;
}
.bottom-nav a{
  min-width:0 !important;
  padding-left:2px !important;
  padding-right:2px !important;
}
.bottom-nav a .ico{
  font-size:18px !important;
}
.bottom-nav a > span:last-child{
  font-size:8.5px !important;
  white-space:nowrap !important;
}
.bottom-nav .love-ai-nav{
  color:#f5a4ce !important;
}
</style>


<style id="duo-v53-six-nav">
  .bottom-nav{
    display:grid !important;
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;
    gap:2px !important;
  }
  .bottom-nav .nav-item,
  .bottom-nav a{
    min-width:0 !important;
    padding-left:2px !important;
    padding-right:2px !important;
  }
  .bottom-nav .nav-icon,
  .bottom-nav .ico{
    font-size:18px !important;
  }
  .bottom-nav .nav-item > span:last-child,
  .bottom-nav a > span:last-child{
    font-size:8.5px !important;
    white-space:nowrap !important;
  }
  .bottom-nav .love-ai-nav{
    color:#f3a4cd !important;
  }
</style>

</head>
<body>
<main class="page">
  <header class="top">
    <div class="top-left">
      <button class="back" type="button" onclick="location.href='./index.html'">←</button>
      <div><span class="kicker">📸 AMINTIRILE NOASTRE</span><h1>Albume & momente</h1></div>
    </div>
    <button id="newAlbum" class="secondary" type="button">+ Album</button>
  </header>

  <section class="card">
    <h2>Adaugă o amintire ❤️</h2>
    <p class="muted">Selectezi mai multe poze odată, scrii despre moment și îl pui într-un album.</p>

    <div class="two">
      <div class="field"><label>TITLU</label><input id="title" maxlength="120" placeholder="Ex: Weekend-ul nostru"></div>
      <div class="field"><label>DATA</label><input id="date" type="date"></div>
    </div>

    <div class="field"><label>ALBUM</label><select id="album"></select></div>
    <div class="field"><label>DESPRE AMINTIRE</label><textarea id="text" maxlength="10000" placeholder="Scrie aici povestea momentului... ❤️"></textarea></div>
    <div class="field">
      <label>POZE — POȚI ALEGE MAI MULTE</label>
      <input id="photos" type="file" accept="image/*" multiple>
      <div id="fileNote" class="file-note">Nicio poză selectată</div>
    </div>

    <button id="save" class="primary" type="button" style="width:100%;margin-top:10px">Salvează amintirea ❤️</button>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <h2 style="margin:0">Albume</h2>
      <span id="count" class="muted">0 amintiri</span>
    </div>
    <div id="albums" class="album-row"></div>
  </section>

  <section id="list" class="memory-list"></section>
</main>

<div id="modal" class="modal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 id="viewTitle" style="margin:0">Amintire</h2>
      <button id="close" class="secondary" type="button">Închide</button>
    </div>
    <div id="viewer" class="viewer"></div>
    <p id="viewMeta" class="muted"></p>
    <p id="viewText" style="white-space:pre-wrap;line-height:1.55"></p>
  </div>
</div>

<div id="toast" class="toast">Gata ❤️</div>

<nav class="bottom-nav">
  <a href="./index.html"><span class="ico">🏠</span><span>Acasă</span></a>
  <a href="./chat.html"><span class="ico">💬</span><span>Chat</span></a>
  <a class="love-ai-nav" href="./love-studio.html"><span class="ico">✨</span><span>Love AI</span></a>
  <a class="active" href="./amintiri.html"><span class="ico">📸</span><span>Amintiri</span></a>
  <a href="./evenimente.html"><span class="ico">📅</span><span>Evenimente</span></a>
  <a href="./setari.html"><span class="ico">⚙️</span><span>Setări</span></a>
</nav>

<script src="./duo-media.js"></script>
<script src="./tema.js?v=54"></script>
<script>
window.addEventListener("pageshow", function(){
  if (typeof window.applyGlobalBackground === "function") window.applyGlobalBackground();
  if (typeof window.applyGlobalFont === "function") window.applyGlobalFont();
});
window.addEventListener("storage", function(event){
  if (event.key === "selectedTheme" || event.key === "customBackground") {
    if (typeof window.applyGlobalBackground === "function") window.applyGlobalBackground();
  }
});
</script>
<script>
(function(){
  const MEM_KEY="duoMemoriesV46";
  const ALBUM_KEY="duoAlbumsV46";
  const title=document.getElementById("title");
  const date=document.getElementById("date");
  const album=document.getElementById("album");
  const text=document.getElementById("text");
  const photos=document.getElementById("photos");
  const list=document.getElementById("list");
  const albumsEl=document.getElementById("albums");
  const toast=document.getElementById("toast");

  let active="all";
  let urls=[];

  date.value=new Date().toISOString().slice(0,10);

  function esc(s){const d=document.createElement("div");d.textContent=String(s??"");return d.innerHTML}
  function memories(){try{return JSON.parse(localStorage.getItem(MEM_KEY)||"[]")||[]}catch(e){return[]}}
  function saveMem(v){
    try{
      localStorage.setItem(MEM_KEY,JSON.stringify(v));
      return true;
    }catch(e){
      console.error("Nu s-au putut salva amintirile:",e);
      show("Spațiul de stocare este plin. Șterge câteva date vechi și încearcă din nou.");
      return false;
    }
  }
  function albums(){
    let arr=[];
    try{arr=JSON.parse(localStorage.getItem(ALBUM_KEY)||"[]")||[]}catch(e){}
    if(!arr.length){
      arr=[{id:"general",name:"Momentele noastre",emoji:"❤️",createdAt:Date.now()}];
      localStorage.setItem(ALBUM_KEY,JSON.stringify(arr));
    }
    return arr;
  }
  function saveAlbums(v){localStorage.setItem(ALBUM_KEY,JSON.stringify(v))}
  function albumLabel(id){const a=albums().find(x=>x.id===id);return a?(a.emoji+" "+a.name):"❤️ Momentele noastre"}
  function show(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
  function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}

  function renderSelect(){
    album.innerHTML=albums().map(a=>`<option value="${a.id}">${esc(a.emoji+" "+a.name)}</option>`).join("");
  }

  function renderAlbums(){
    const mem=memories();
    const arr=albums();

    albumsEl.innerHTML=
      `<button class="album-btn ${active==="all"?"active":""}" data-id="all"><strong>✨ Toate</strong><span>${mem.length} amintiri</span></button>`+
      arr.map(a=>{
        const n=mem.filter(m=>m.albumId===a.id).length;
        return `<button class="album-btn ${active===a.id?"active":""}" data-id="${a.id}"><strong>${esc(a.emoji+" "+a.name)}</strong><span>${n} amintiri</span></button>`;
      }).join("");

    albumsEl.querySelectorAll("[data-id]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        active=btn.dataset.id;
        renderAlbums();
        renderList();
      });
    });
  }

  async function renderList(){
    clearUrls();
    const all=memories();
    const data=(active==="all"?all:all.filter(m=>m.albumId===active))
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt);

    document.getElementById("count").textContent=all.length+" "+(all.length===1?"amintire":"amintiri");
    list.innerHTML="";

    if(!data.length){
      list.innerHTML='<div class="empty"><span>📷</span>Nu ai încă amintiri aici.</div>';
      return;
    }

    for(const m of data){
      let media=[];
      try{media=await DuoMedia.listOwner(m.id)}catch(e){console.error(e)}
      const purls=media.map(r=>{const u=DuoMedia.objectURL(r);urls.push(u);return u;});
      const first=purls.slice(0,4);

      let photosHtml="";
      if(first.length){
        photosHtml='<div class="photos '+(first.length===1?"one":"")+'">'+first.map((u,i)=>{
          const more=(i===3 && purls.length>4)?`<span class="more">+${purls.length-4}</span>`:"";
          return `<div class="photo-wrap"><img src="${u}" alt="">${more}</div>`;
        }).join("")+'</div>';
      }

      const article=document.createElement("article");
      article.className="memory";
      article.innerHTML=photosHtml+`
        <div class="copy">
          <h3>${esc(m.title||"Amintirea noastră ❤️")}</h3>
          <div class="meta">
            <span>📅 ${new Date((m.date||date.value)+"T00:00:00").toLocaleDateString("ro-RO")}</span>
            <span>${esc(albumLabel(m.albumId))}</span>
            <span>📸 ${media.length}</span>
          </div>
          ${m.text?`<p class="memory-text-preview">${esc(m.text)}</p>`:""}
          <div class="actions">
            <button class="secondary view" type="button">Vezi toate</button>
            <button class="danger del" type="button">Șterge</button>
          </div>
        </div>
      `;

      article.querySelector(".view").addEventListener("click",()=>openMemory(m,media));
      article.querySelector(".del").addEventListener("click",async()=>{
        if(!confirm("Ștergi această amintire?")) return;
        saveMem(memories().filter(x=>x.id!==m.id));
        try{await DuoMedia.deleteOwner(m.id)}catch(e){console.error(e)}
        show("Amintire ștearsă.");
        renderAlbums();
        renderList();
      });

      list.appendChild(article);
    }
  }

  function openMemory(m,media){
    const viewer=document.getElementById("viewer");
    viewer.innerHTML="";
    media.forEach(r=>{
      const u=DuoMedia.objectURL(r);
      urls.push(u);
      const img=document.createElement("img");
      img.src=u;
      viewer.appendChild(img);
    });

    document.getElementById("viewTitle").textContent=m.title||"Amintirea noastră ❤️";
    document.getElementById("viewMeta").textContent=
      albumLabel(m.albumId)+" · "+new Date((m.date||date.value)+"T00:00:00").toLocaleDateString("ro-RO");
    document.getElementById("viewText").textContent=m.text||"";
    document.getElementById("modal").classList.add("open");
  }

  photos.addEventListener("change",()=>{
    const n=photos.files.length;
    document.getElementById("fileNote").textContent=
      n ? n+" "+(n===1?"poză selectată":"poze selectate") : "Nicio poză selectată";
  });

  document.getElementById("newAlbum").addEventListener("click",()=>{
    const name=prompt("Numele albumului:");
    if(!name || !name.trim()) return;
    const emoji=(prompt("Emoji pentru album:","💞")||"💞").trim().slice(0,4)||"💞";

    const arr=albums();
    const item={id:DuoMedia.uid("album"),name:name.trim(),emoji,createdAt:Date.now()};
    arr.push(item);
    saveAlbums(arr);

    renderSelect();
    album.value=item.id;
    active=item.id;
    renderAlbums();
    renderList();
    show("Album creat ✅");
  });

  document.getElementById("save").addEventListener("click",async()=>{
    const files=Array.from(photos.files||[]);
    const ttl=title.value.trim();
    const txt=text.value.trim();

    if(!ttl && !txt && !files.length){
      show("Adaugă un titlu, text sau poze.");
      return;
    }

    const btn=document.getElementById("save");
    btn.disabled=true;
    btn.textContent="Se salvează...";

    const memory={
      id:DuoMedia.uid("memory"),
      title:ttl||"Amintirea noastră ❤️",
      text:txt,
      date:date.value||new Date().toISOString().slice(0,10),
      albumId:album.value||"general",
      createdAt:Date.now()
    };

    try{
      if(files.length){
        await DuoMedia.saveFiles(memory.id,"memory",files);
      }

      const all=memories();
      all.unshift(memory);
      if(!saveMem(all)){
        if(files.length) await DuoMedia.deleteOwner(memory.id);
        return;
      }

      title.value="";
      text.value="";
      photos.value="";
      document.getElementById("fileNote").textContent="Nicio poză selectată";

      show("Amintire salvată ❤️");
      renderAlbums();
      await renderList();
    }catch(e){
      console.error(e);
      show("Nu am putut salva pozele.");
    }finally{
      btn.disabled=false;
      btn.textContent="Salvează amintirea ❤️";
    }
  });

  document.getElementById("close").addEventListener("click",()=>document.getElementById("modal").classList.remove("open"));
  document.getElementById("modal").addEventListener("click",e=>{
    if(e.target.id==="modal") e.currentTarget.classList.remove("open");
  });

  renderSelect();
  renderAlbums();
  renderList();
})();
</script>
</body>
</html>
