<!doctype html>
<html lang="ro" class="duo-scroll-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09070d">
<link rel="stylesheet" href="./style.css?v=60">
<title>Evenimente ❤️</title>
<style>

:root{
  --bg:#09070d;
  --panel:rgba(22,12,25,.86);
  --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10);
  --text:#fff7fb;
  --muted:rgba(255,235,246,.64);
  --pink:#e25291;
  --pink2:#f18fbd;
  --purple:#8a5bd3;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 18% 15%,rgba(226,77,142,.24),transparent 32%),
    radial-gradient(circle at 84% 28%,rgba(116,83,221,.22),transparent 34%),
    linear-gradient(160deg,#08070d,#190d19 55%,#09070d);
  background-attachment:fixed;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
.page{width:min(100%,760px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.back{
  flex:0 0 46px;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;
  background:rgba(255,255,255,.07);color:white;font-size:22px;cursor:pointer
}
.kicker{display:block;color:#ef91bd;font-size:10px;font-weight:950;letter-spacing:1.5px}
h1{margin:3px 0 0;font-size:28px;line-height:1.1}
.card,.empty,.memory,.event{
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 14px 34px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}
.card{margin-top:12px;padding:14px;border-radius:25px}
.card h2{margin:0 0 5px;font-size:18px}
.muted{color:var(--muted);font-size:11px;line-height:1.5}
.field{margin-top:10px}
.field label{display:block;margin-bottom:5px;color:#ef91bd;font-size:10px;font-weight:900}
.field input,.field textarea,.field select{
  width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:15px;
  outline:none;background:rgba(7,6,12,.66);color:white
}
.field textarea{min-height:100px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,240,247,.42)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary,.secondary,.danger{
  min-height:44px;border:0;border-radius:14px;padding:10px 12px;font-weight:900;cursor:pointer
}
.primary{background:linear-gradient(135deg,#df4f91,#8a58d3);color:white}
.secondary{border:1px solid var(--line);background:rgba(255,255,255,.07);color:white}
.danger{background:rgba(225,87,101,.13);color:#ffb9c0;border:1px solid rgba(225,87,101,.18)}
.empty{margin-top:12px;padding:28px 16px;border-radius:24px;text-align:center;color:var(--muted)}
.empty span{display:block;font-size:40px;margin-bottom:6px}
.toast{
  position:fixed;z-index:300;left:50%;bottom:100px;transform:translate(-50%,18px);
  max-width:calc(100% - 30px);padding:11px 15px;border:1px solid var(--line);border-radius:16px;
  background:rgba(15,9,18,.96);color:#fff;font-size:12px;font-weight:850;text-align:center;
  opacity:0;transition:.2s ease;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom-nav{
  position:fixed;z-index:100;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(calc(100% - 20px),760px);
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;
  border:1px solid var(--line);border-radius:22px;background:rgba(12,8,16,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 32px rgba(0,0,0,.34)
}
.bottom-nav a{min-width:0;padding:7px 2px;border-radius:15px;color:rgba(255,240,247,.60);text-decoration:none;text-align:center;font-size:9px}
.bottom-nav a span{display:block}
.bottom-nav .ico{font-size:19px;margin-bottom:2px}
.bottom-nav a.active{background:rgba(226,77,142,.16);color:white}
@media(max-width:500px){.two{grid-template-columns:1fr}}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:38px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;
  background:rgba(255,255,255,.06);color:white;font-size:11px;font-weight:850;cursor:pointer
}
.chip.active{border-color:rgba(239,145,189,.42);background:rgba(226,77,142,.17)}
.quick-title{margin:10px 0 6px;color:#ef91bd;font-size:10px;font-weight:900}
.event-list{display:grid;gap:10px;margin-top:12px}
.event{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px;border-radius:23px}
.event-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(226,77,142,.13);font-size:26px}
.event-copy{min-width:0}
.event-copy h3{margin:0;font-size:15px}
.event-copy p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.4}
.countdown{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:999px;background:rgba(226,77,142,.15);color:#ffc0dd;font-size:9px;font-weight:900}
.del{width:40px;height:40px;border:1px solid rgba(225,87,101,.18);border-radius:13px;background:rgba(225,87,101,.13);color:#ffb9c0;cursor:pointer}
@media(max-width:470px){.event{grid-template-columns:48px minmax(0,1fr)}.event-icon{width:48px;height:48px}.del{grid-column:2;width:100%}}

/* v55: formular compact + texte lungi sigure pe mobil */
.page{padding:0 0 calc(92px + env(safe-area-inset-bottom))}
.event-copy h3,.event-copy p{overflow-wrap:anywhere;word-break:break-word}
.event-note-preview{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;
  max-height:5.8em;
}
.field textarea{max-height:220px}
@media(max-width:500px){
  h1{font-size:23px}.card{padding:12px;border-radius:20px}.card h2{font-size:16px}
  .field input,.field textarea,.field select{font-size:16px;min-height:44px}
  .field textarea{min-height:86px}
  .page{padding-left:10px;padding-right:10px}
}
</style>

  .bottom-nav{
    display:grid !important;
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;

  .bottom-nav .nav-item,
  .bottom-nav a{

  }

  }

    color:#f3a4cd !important;

<body class="duo-scroll-page">
<main class="page">
  <header class="top">
    <div class="top-left">
      <button class="back" type="button" onclick="location.href='./index.html'">←</button>
      <div><span class="kicker">📅 EVENIMENTE</span><h1>Creează simplu</h1></div>
    </div>
  </header>

  <section class="card">
    <h2>Eveniment nou ❤️</h2>
    <p class="muted">Alegi tipul, data și salvezi. Detaliile sunt opționale.</p>

    <div class="quick-title">ALEGE TIPUL</div>
    <div class="chips" id="typeChips">
      <button class="chip" data-title="Aniversarea noastră ❤️" data-icon="💞">💞 Aniversare</button>
      <button class="chip" data-title="Date night ❤️" data-icon="🌹">🌹 Date</button>
      <button class="chip" data-title="Zi de naștere 🎂" data-icon="🎂">🎂 Zi de naștere</button>
      <button class="chip" data-title="Vacanță ✈️" data-icon="✈️">✈️ Vacanță</button>
      <button class="chip" data-title="" data-icon="❤️">❤️ Altceva</button>
    </div>

    <div class="field"><label>NUME EVENIMENT</label><input id="title" maxlength="120" placeholder="Ex: Cina noastră ❤️"></div>

    <div class="quick-title">DATA RAPIDĂ</div>
    <div class="chips" id="dateChips">
      <button class="chip" data-days="0">Astăzi</button>
      <button class="chip" data-days="1">Mâine</button>
      <button class="chip" data-days="7">Peste 7 zile</button>
      <button class="chip" data-weekend="1">Weekend</button>
    </div>

    <div class="two">
      <div class="field"><label>DATA</label><input id="date" type="date"></div>
      <div class="field"><label>ICON</label>
        <select id="icon">
          <option value="❤️">❤️ Iubire</option>
          <option value="💞">💞 Aniversare</option>
          <option value="🌹">🌹 Date</option>
          <option value="🎂">🎂 Zi de naștere</option>
          <option value="✈️">✈️ Vacanță</option>
          <option value="🎁">🎁 Cadou</option>
        </select>
      </div>
    </div>

    <div class="field"><label>DETALII — OPȚIONAL</label><textarea id="note" maxlength="4000" placeholder="Loc, oră, ce vreți să faceți..."></textarea></div>

    <label style="display:flex;align-items:center;gap:9px;margin-top:10px;color:rgba(255,235,246,.72);font-size:11px">
      <input id="repeat" type="checkbox" style="width:18px;height:18px">
      Repetă în fiecare an
    </label>

    <button id="save" class="primary" type="button" style="width:100%;margin-top:10px">Salvează evenimentul ❤️</button>
  </section>

  <section id="list" class="event-list"></section>
</main>

<div id="toast" class="toast">Eveniment salvat ❤️</div>

  <a href="./index.html"><span class="ico">🏠</span><span>Acasă</span></a>
  <a href="./chat.html"><span class="ico">💬</span><span>Chat</span></a>
  <a class="love-ai-nav" href="./love-studio.html"><span class="ico">✨</span><span>Love AI</span></a>
  <a href="./amintiri.html"><span class="ico">📸</span><span>Amintiri</span></a>
  <a class="active" href="./evenimente.html"><span class="ico">📅</span><span>Evenimente</span></a>
  <a href="./setari.html"><span class="ico">⚙️</span><span>Setări</span></a>
</nav>

<script src="./tema.js?v=69"></script>
<script>
window.addEventListener("pageshow", function(){
  if (typeof window.applyGlobalBackground === "function") window.applyGlobalBackground();
  if (typeof window.applyGlobalFont === "function") window.applyGlobalFont();
});
window.addEventListener("storage", function(event){
  if (event.key === "selectedTheme" || event.key === "customBackground") {
    if (typeof window.applyGlobalBackground === "function") window.applyGlobalBackground();
  }
});
</script>
<script>
(function(){
  const KEY="loveEvents";
  const title=document.getElementById("title");
  const date=document.getElementById("date");
  const icon=document.getElementById("icon");
  const note=document.getElementById("note");
  const repeat=document.getElementById("repeat");
  const list=document.getElementById("list");
  const toast=document.getElementById("toast");

  function localISO(d=new Date()){
    const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);
    return x.toISOString().slice(0,10);
  }

  date.value=localISO();

  function esc(s){const d=document.createElement("div");d.textContent=String(s??"");return d.innerHTML}
  function getEvents(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){return[]}}
  function saveEvents(v){
    try{
      localStorage.setItem(KEY,JSON.stringify(v));
      return true;
    }catch(e){
      console.error("Nu s-au putut salva evenimentele:",e);
      show("Spațiul de stocare este plin. Șterge câteva date vechi și încearcă din nou.");
      return false;
    }
  }
  function show(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}

  function getNext(e){
    const base=new Date(e.date+"T12:00:00");
    if(!e.repeatYearly) return base;

    const now=new Date();
    now.setHours(0,0,0,0);

    let candidate=new Date(now.getFullYear(),base.getMonth(),base.getDate(),12,0,0);
    if(candidate<now){
      candidate=new Date(now.getFullYear()+1,base.getMonth(),base.getDate(),12,0,0);
    }
    return candidate;
  }

  function remaining(target){
    const now=new Date();
    now.setHours(0,0,0,0);

    const t=new Date(target);
    t.setHours(0,0,0,0);

    const days=Math.round((t-now)/86400000);

    if(days===0) return "Este astăzi! 🎉";
    if(days===1) return "Mai este 1 zi ❤️";
    if(days>1) return "Mai sunt "+days+" zile";
    if(days===-1) return "A fost ieri";
    return "A trecut de "+Math.abs(days)+" zile";
  }

  function render(){
    const source=getEvents();
    const events=source
      .map((e,index)=>({...e,_index:index,_next:getNext(e)}))
      .sort((a,b)=>a._next-b._next);

    list.innerHTML="";

    if(!events.length){
      list.innerHTML='<div class="empty"><span>📅</span>Nu ai încă evenimente.</div>';
      return;
    }

    events.forEach(e=>{
      const card=document.createElement("article");
      card.className="event";
      card.dataset.eventId=e.id;
      card.innerHTML=`
        <div class="event-icon">${esc(e.icon||"❤️")}</div>
        <div class="event-copy">
          <h3>${esc(e.title||"Eveniment ❤️")}</h3>
          <p>📅 ${e._next.toLocaleDateString("ro-RO",{day:"numeric",month:"long",year:"numeric"})}${e.repeatYearly?" · 🔁 anual":""}</p>
          ${e.note?`<p class="event-note-preview">${esc(e.note)}</p>`:""}
          <span class="countdown">${remaining(e._next)}</span>
        </div>
        <button class="del" type="button">🗑️</button>
      `;

      card.querySelector(".del").addEventListener("click",()=>{
        if(!confirm("Ștergi evenimentul?")) return;
        const arr=getEvents();
        arr.splice(e._index,1);
        saveEvents(arr);
        render();
      });

      list.appendChild(card);
    });
  }

  document.querySelectorAll("#typeChips .chip").forEach(btn=>{
    btn.addEventListener("click",()=>{
      title.value=btn.dataset.title||"";
      icon.value=btn.dataset.icon||"❤️";
      document.querySelectorAll("#typeChips .chip").forEach(x=>x.classList.toggle("active",x===btn));
      if(!btn.dataset.title) title.focus();
    });
  });

  document.querySelectorAll("#dateChips .chip").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const d=new Date();

      if(btn.dataset.weekend){
        const day=d.getDay();
        let add=(6-day+7)%7;
        if(add===0) add=7;
        d.setDate(d.getDate()+add);
      }else{
        d.setDate(d.getDate()+Number(btn.dataset.days||0));
      }

      date.value=localISO(d);
      document.querySelectorAll("#dateChips .chip").forEach(x=>x.classList.toggle("active",x===btn));
    });
  });

  document.getElementById("save").addEventListener("click",()=>{
    const ttl=title.value.trim();

    if(!ttl){
      show("Scrie numele evenimentului.");
      title.focus();
      return;
    }

    if(!date.value){
      show("Alege data.");
      return;
    }

    const arr=getEvents();
    const newId="event_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    arr.unshift({
      id:newId,
      title:ttl,
      date:date.value,
      icon:icon.value||"❤️",
      note:note.value.trim(),
      repeatYearly:repeat.checked,
      createdAt:Date.now()
    });

    if(!saveEvents(arr)){
      return;
    }

    title.value="";
    note.value="";
    repeat.checked=false;
    icon.value="❤️";
    date.value=localISO();

    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    show("Eveniment salvat ❤️");
    render();
    const created=[...document.querySelectorAll(".event[data-event-id]")]
      .find(el=>el.dataset.eventId===newId);
    if(created) requestAnimationFrame(()=>created.scrollIntoView({behavior:"smooth",block:"start"}));
  });

  render();
})();
</script>
</body>
</html>
