<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">

  <meta

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta

    content="black-translucent"
  >

  <title>Evenimente ❤️</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="stylesheet"
    href="./style.css?v=31"
  >


  <style>

    body.events-page {
      margin: 0 !important;
      padding: 0 !important;

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;

      background-color: transparent;
    }


    body.events-page .app {
      width:
        min(
          calc(100% - 20px),
          430px
        ) !important;

      margin:
        0 auto !important;

      padding:
        calc(
          env(safe-area-inset-top) + 10px
        )
        0
        calc(
          95px +
          env(safe-area-inset-bottom)
        ) !important;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .events-header {
      margin:
        0
        0
        14px !important;

      padding:
        22px
        18px !important;

      border-radius:
        25px !important;

      background:
        rgba(
          14,
          9,
          18,
          0.84
        ) !important;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.09
        ) !important;

      backdrop-filter:
        blur(18px) !important;

      -webkit-backdrop-filter:
        blur(18px) !important;
    }


    .events-small {
      display: block;

      margin-bottom: 8px;

      color: #ef93bd;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 3px;
    }


    .events-header h1 {
      margin:
        0
        0
        8px !important;

      font-size:
        32px !important;

      color:
        white !important;
    }


    .events-header p {
      margin:
        0
        0
        18px;

      color:
        rgba(
          255,
          255,
          255,
          0.70
        ) !important;

      line-height:
        1.5;
    }


    .add-event-button {
      width: 100%;

      min-height: 52px;

      padding: 12px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.10
        );

      border-radius:
        17px;

      background:
        rgba(
          112,
          38,
          77,
          0.68
        );

      color:
        white;

      font:
        inherit;

      font-weight:
        700;

      cursor:
        pointer;

      appearance:
        none;

      -webkit-appearance:
        none;
    }


    /* =====================================================
       LISTĂ
    ====================================================== */

    .events-list {
      display: grid !important;

      grid-template-columns:
        1fr !important;

      gap:
        12px !important;

      width:
        100% !important;

      margin:
        0 !important;

      padding:
        0 !important;
    }


    /*
      IMPORTANT:
      style.css avea o regulă veche cu
      .event-card { display:flex; }
      Aici o anulăm.
    */

    .event-card {
      display:
        block !important;

      width:
        100% !important;

      min-height:
        0 !important;

      margin:
        0 !important;

      padding:
        17px !important;

      gap:
        0 !important;

      box-sizing:
        border-box !important;

      border-radius:
        22px !important;

      background:
        rgba(
          14,
          9,
          18,
          0.84
        ) !important;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.09
        ) !important;

      color:
        white !important;

      backdrop-filter:
        blur(18px) !important;

      -webkit-backdrop-filter:
        blur(18px) !important;
    }


    .event-card-top {
      width:
        100% !important;

      display:
        flex !important;

      justify-content:
        space-between !important;

      align-items:
        flex-start !important;

      gap:
        12px !important;
    }


    .event-content {
      flex:
        1 1 auto;

      min-width:
        0;
    }


    .event-card h2 {
      margin:
        0
        0
        6px !important;

      color:
        white !important;

      font-size:
        25px !important;

      line-height:
        1.15 !important;

      overflow-wrap:
        anywhere;
    }


    .event-date {
      margin:
        0
        0
        10px;

      color:
        #ef93bd !important;

      font-weight:
        700;
    }


    .event-note {
      margin:
        0;

      color:
        rgba(
          255,
          255,
          255,
          0.68
        ) !important;

      line-height:
        1.5;

      overflow-wrap:
        anywhere;
    }


    .event-countdown {
      display:
        block !important;

      width:
        100% !important;

      margin-top:
        14px !important;

      padding-top:
        13px !important;

      border-top:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        ) !important;

      color:
        #ffbdd8 !important;

      font-weight:
        700;

      font-size:
        17px;

      line-height:
        1.35;
    }


    .delete-event {
      flex:
        0 0
        42px !important;

      width:
        42px !important;

      height:
        42px !important;

      margin:
        0 !important;

      padding:
        0 !important;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        ) !important;

      border-radius:
        14px !important;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        ) !important;

      color:
        white !important;

      font-size:
        18px;

      cursor:
        pointer;

      appearance:
        none;

      -webkit-appearance:
        none;
    }


    /* =====================================================
       FĂRĂ EVENIMENTE
    ====================================================== */

    .events-empty {
      padding:
        24px;

      text-align:
        center;

      border-radius:
        22px;

      background:
        rgba(
          14,
          9,
          18,
          0.84
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.09
        );

      color:
        white;
    }


    .events-empty span {
      display:
        block;

      margin-bottom:
        10px;

      font-size:
        34px;
    }


    .events-empty h2 {
      margin:
        0
        0
        7px !important;

      color:
        white !important;
    }


    .events-empty p {
      margin:
        0;

      color:
        rgba(
          255,
          255,
          255,
          0.65
        );
    }


    /* =====================================================
       MODAL
    ====================================================== */

    .event-modal {
      position:
        fixed;

      inset:
        0;

      z-index:
        2147483647;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        18px;

      box-sizing:
        border-box;

      background:
        rgba(
          0,
          0,
          0,
          0.65
        );

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);
    }


    .event-modal.hidden {
      display:
        none !important;
    }


    .event-modal-card {
      position:
        relative;

      width:
        min(
          100%,
          390px
        );

      max-height:
        calc(
          100dvh -
          40px
        );

      overflow-y:
        auto;

      padding:
        22px;

      box-sizing:
        border-box;

      border-radius:
        25px;

      background:
        rgba(
          17,
          10,
          21,
          0.98
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.11
        );

      color:
        white;
    }


    .event-modal-card h2 {
      margin:
        0
        0
        18px !important;

      color:
        white !important;

      font-size:
        25px !important;
    }


    .event-modal-card input,
    .event-modal-card textarea {
      width:
        100%;

      box-sizing:
        border-box;

      margin-bottom:
        11px;

      padding:
        14px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.12
        );

      border-radius:
        16px;

      outline:
        none;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        );

      color:
        white;

      font:
        inherit;
    }


    #eventDate {
      color-scheme:
        dark;
    }


    .event-modal-card textarea {
      min-height:
        100px;

      resize:
        none;
    }


    .close-event-modal {
      position:
        absolute;

      top:
        14px;

      right:
        14px;

      width:
        38px;

      height:
        38px;

      border:
        0;

      border-radius:
        50%;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      color:
        white;

      font-size:
        24px;

      cursor:
        pointer;
    }


    .save-event-button {
      width:
        100%;

      min-height:
        50px;

      padding:
        14px;

      border:
        0;

      border-radius:
        17px;

      background:
        linear-gradient(
          135deg,
          #c95887,
          #993f6b
        );

      color:
        white;

      font:
        inherit;

      font-weight:
        700;

      cursor:
        pointer;
    }


    /* =====================================================
       MENIU
    ====================================================== */

    body.events-page > .bottom-nav {
      position:
        fixed !important;

      left:
        0 !important;

      right:
        0 !important;

      top:
        auto !important;

      bottom:
        0 !important;

      transform:
        none !important;

      width:
        100% !important;

      max-width:
        none !important;

      margin:
        0 !important;

      z-index:
        2147483646 !important;
    }


    @media (
      max-width: 390px
    ) {

      body.events-page .app {
        width:
          calc(
            100% -
            14px
          ) !important;
      }


      .events-header {
        padding:
          18px
          16px !important;
      }


      .event-card {
        padding:
          16px !important;
      }


      .event-card h2 {
        font-size:
          23px !important;
      }


      .event-countdown {
        font-size:
          16px;
      }

    }

  </style>

</head>


<body
  class="events-page page-evenimente"
  data-build="v21"
>


  <main class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="events-header">

      <span class="events-small">
        📅 EVENIMENTE
      </span>


      <h1>
        Date importante
      </h1>


      <p>
        Ziua ei, aniversări și toate zilele pe care nu vrem să le uităm. ❤️

      <button
        id="openEventModal"
        class="add-event-button"
        type="button"
      >
        + Adaugă eveniment

         LISTĂ
    ====================================================== -->

      id="eventsList"
      class="events-list"
    ></section>


  </main>



  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div
    id="eventModal"
    class="event-modal hidden"
  >

    <div class="event-modal-card">


      <button
        id="closeEventModal"
        class="close-event-modal"
        type="button"
        aria-label="Închide"
      >
        ×
      </button>


      <h2>
        Eveniment nou 📅
      </h2>


      <input
        id="eventTitle"

        placeholder="Ex: Ziua ei 🎂"

      >


      <input
        id="eventDate"
        type="date"
      >


      <textarea
        id="eventNote"
        placeholder="Detalii..."
      ></textarea>


      <button
        id="saveEvent"
        class="save-event-button"
        type="button"
      >
        Salvează ❤️
      </button>


    </div>

  <!-- =====================================================
       MENIU
  ====================================================== -->

  <nav class="bottom-nav">

  <!-- =====================================================
       SCRIPTURI
  ====================================================== -->

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js?v=31"></script>
<script src="./security.js?v=32"></script>
  <script src="./cloud-sync.js?v=21"></script>

  <script src="./tema.js?v=21"></script>



  <script>

    console.log(
      "❤️ DUO LOVE BUILD v21 - EVENIMENTE"
    );


    /* =====================================================
       ELEMENTE
    ====================================================== */

    const eventsList =
      document.getElementById(
        "eventsList"
      );


    const eventModal =
      document.getElementById(
        "eventModal"
      );


    const openEventModal =
      document.getElementById(
        "openEventModal"
      );


    const closeEventModal =
      document.getElementById(
        "closeEventModal"
      );


    const eventTitle =
      document.getElementById(
        "eventTitle"
      );


    const eventDate =
      document.getElementById(
        "eventDate"
      );


    const eventNote =
      document.getElementById(
        "eventNote"
      );


    const saveEventButton =
      document.getElementById(
        "saveEvent"
      );



    /* =====================================================
       MENIUL DE JOS
    ====================================================== */

    document
      .querySelectorAll(
        ".bottom-nav .nav-item[data-page]"
      )
      .forEach(
        function (
          button
        ) {

          button.addEventListener(
            "click",
            function () {

              const page =
                this.dataset.page;


              if (
                page
              ) {

                window.location.href =
                  "./" +
                  page;

              }

            }
          );

        }
      );



    /* =====================================================
       AUTENTIFICARE
    ====================================================== */

    async function checkAuthentication() {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        return false;

      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          error ||
          !data ||
          !data.session
        ) {

          window.location.href =
            "./login.html";


          return false;

        }


        return true;

      } catch (
        error
      ) {

        console.error(
          "Eroare autentificare:",
          error
        );


        return false;

      }

    }



    /* =====================================================
       CITEȘTE EVENIMENTE
    ====================================================== */

    function getEvents() {

      try {

        const events =
          JSON.parse(
            localStorage.getItem(
              "loveEvents"
            ) ||
            "[]"
          );


        return Array.isArray(
          events
        )
          ? events
          : [];

      } catch (
        error
      ) {

        return [];

      }

    }



    /* =====================================================
       SALVEAZĂ LOCAL + CLOUD
    ====================================================== */

    function saveEvents(
      events
    ) {

      if (
        typeof window.saveJSON ===
        "function"
      ) {

        window.saveJSON(
          "loveEvents",
          events
        );

      } else {

        localStorage.setItem(
          "loveEvents",
          JSON.stringify(
            events
          )
        );

      }

    }



    /* =====================================================
       ID UNIC
    ====================================================== */

    function createEventId() {

      if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"
      ) {

        return window.crypto
          .randomUUID();

      }


      return (
        Date.now() +
        "-" +
        Math.random()
          .toString(
            36
          )
          .slice(
            2
          )
      );

    }



    /* =====================================================
       FORMATARE DATĂ
    ====================================================== */

    function formatDate(
      value
    ) {

      if (
        !value
      ) {

        return "";

      }


      const date =
        new Date(
          value +
          "T00:00:00"
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date
        .toLocaleDateString(
          "ro-RO",
          {
            day:
              "numeric",

            month:
              "long",

            year:
              "numeric"
          }
        );

    }



    /* =====================================================
       NUMĂR ZILE
    ====================================================== */

    function getCountdownText(
      value
    ) {

      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      const target =
        new Date(
          value +
          "T00:00:00"
        );


      if (
        Number.isNaN(
          target.getTime()
        )
      ) {

        return "";

      }


      const difference =
        Math.ceil(
          (
            target -
            today
          ) /
          86400000
        );


      if (
        difference === 0
      ) {

        return "🎉 Este astăzi! ❤️";

      }


      if (
        difference === 1
      ) {

        return "❤️ Mai este 1 zi";

      }


      if (
        difference > 1
      ) {

        return (
          "❤️ Mai sunt " +
          difference +
          " zile"
        );

      }


      const passed =
        Math.abs(
          difference
        );


      if (
        passed === 1
      ) {

        return "A fost ieri ❤️";

      }


      return (
        "Au trecut " +
        passed +
        " zile"
      );

    }



    /* =====================================================
       RANDARE
    ====================================================== */

    function renderEvents() {

      const events =
        getEvents();


      eventsList.innerHTML =
        "";


      if (
        !events.length
      ) {

        eventsList.innerHTML = `

          <div class="events-empty">

            <span>
              📅
            </span>

            <h2>
              Niciun eveniment
            </h2>

            <p>
              Adaugă o dată importantă pentru voi. ❤️
            </p>

          </div>

        `;


        return;

      }


      const sortedEvents =
        [
          ...events
        ]
          .sort(
            function (
              a,
              b
            ) {

              return (
                new Date(
                  a.date +
                  "T00:00:00"
                ) -
                new Date(
                  b.date +
                  "T00:00:00"
                )
              );

            }
          );


      sortedEvents
        .forEach(
          function (
            event
          ) {

            const card =
              document.createElement(
                "article"
              );


            card.className =
              "event-card";


            const top =
              document.createElement(
                "div"
              );


            top.className =
              "event-card-top";


            const content =
              document.createElement(
                "div"
              );


            content.className =
              "event-content";


            const title =
              document.createElement(
                "h2"
              );


            title.textContent =
              event.title ||
              "Eveniment ❤️";


            const date =
              document.createElement(
                "p"
              );


            date.className =
              "event-date";


            date.textContent =
              formatDate(
                event.date
              );


            content.appendChild(
              title
            );


            content.appendChild(
              date
            );


            if (
              event.note
            ) {

              const note =
                document.createElement(
                  "p"
                );


              note.className =
                "event-note";


              note.textContent =
                event.note;


              content.appendChild(
                note
              );

            }


            const deleteButton =
              document.createElement(
                "button"
              );


            deleteButton.type =
              "button";


            deleteButton.className =
              "delete-event";


            deleteButton.textContent =
              "🗑";


            deleteButton.setAttribute(
              "aria-label",
              "Șterge evenimentul"
            );


            deleteButton.addEventListener(
              "click",
              function () {

                deleteEvent(
                  event.id
                );

              }
            );


            top.appendChild(
              content
            );


            top.appendChild(
              deleteButton
            );


            const countdown =
              document.createElement(
                "div"
              );


            countdown.className =
              "event-countdown";


            countdown.textContent =
              getCountdownText(
                event.date
              );


            card.appendChild(
              top
            );


            card.appendChild(
              countdown
            );


            eventsList.appendChild(
              card
            );

          }
        );

    }



    /* =====================================================
       DESCHIDE MODAL
    ====================================================== */

    openEventModal
      .addEventListener(
        "click",
        function () {

          eventModal
            .classList
            .remove(
              "hidden"
            );


          setTimeout(
            function () {

              eventTitle
                .focus();

            },
            150
          );

        }
      );



    /* =====================================================
       ÎNCHIDE MODAL
    ====================================================== */

    function closeModal() {

      eventModal
        .classList
        .add(
          "hidden"
        );


      eventTitle.value =
        "";


      eventDate.value =
        "";


      eventNote.value =
        "";

    }


    closeEventModal
      .addEventListener(
        "click",
        closeModal
      );


    eventModal
      .addEventListener(
        "click",
        function (
          event
        ) {

          if (
            event.target ===
            eventModal
          ) {

            closeModal();

          }

        }
      );



    /* =====================================================
       SALVEAZĂ EVENIMENT
    ====================================================== */

    saveEventButton
      .addEventListener(
        "click",
        async function () {

          const title =
            eventTitle.value
              .trim();


          const date =
            eventDate.value;


          const note =
            eventNote.value
              .trim();


          if (
            !title
          ) {

            alert(
              "Scrie numele evenimentului."
            );


            return;

          }


          if (
            !date
          ) {

            alert(
              "Alege data evenimentului."
            );


            return;

          }


          const events =
            getEvents();


          events.push(
            {
              id:
                createEventId(),

              title:
                title,

              date:
                date,

              note:
                note,

              createdAt:
                new Date()
                  .toISOString()
            }
          );


          saveEvents(
            events
          );


          if (
            typeof window.forceCloudSave ===
            "function"
          ) {

            await window
              .forceCloudSave();

          } else if (
            typeof window.saveAppDataToCloud ===
            "function"
          ) {

            await window
              .saveAppDataToCloud();

          }


          closeModal();


          renderEvents();

        }
      );



    /* =====================================================
       ȘTERGE EVENIMENT
    ====================================================== */

    async function deleteEvent(
      id
    ) {

      const events =
        getEvents();


      const updated =
        events.filter(
          function (
            event
          ) {

            return (
              event.id !==
              id
            );

          }
        );


      saveEvents(
        updated
      );


      if (
        typeof window.forceCloudSave ===
        "function"
      ) {

        await window
          .forceCloudSave();

      } else if (
        typeof window.saveAppDataToCloud ===
        "function"
      ) {

        await window
          .saveAppDataToCloud();

      }


      renderEvents();

    }



    /* =====================================================
       MIGRARE EVENIMENTE VECHI
    ====================================================== */

    async function migrateOldEvents() {

      const events =
        getEvents();


      let changed =
        false;


      const updated =
        events.map(
          function (
            event
          ) {

            if (
              event.id
            ) {

              return event;

            }


            changed =
              true;


            return {
              ...event,

              id:
                createEventId()
            };

          }
        );


      if (
        changed
      ) {

        saveEvents(
          updated
        );


        if (
          typeof window.forceCloudSave ===
          "function"
        ) {

          await window
            .forceCloudSave();

        } else if (
          typeof window.saveAppDataToCloud ===
          "function"
        ) {

          await window
            .saveAppDataToCloud();

        }

      }

    }



    /* =====================================================
       START
    ====================================================== */

    async function startEvents() {

      const authenticated =
        await checkAuthentication();


      if (
        !authenticated
      ) {

        return;

      }


      if (
        typeof window.loadAppDataFromCloud ===
        "function"
      ) {

        await window
          .loadAppDataFromCloud();

      }


      if (
        typeof window.applyGlobalBackground ===
        "function"
      ) {

        window
          .applyGlobalBackground();

      }


      if (
        typeof window.applyGlobalFont ===
        "function"
      ) {

        window
          .applyGlobalFont();

      }


      await migrateOldEvents();


      renderEvents();

    }



    startEvents();

  </script>


</body>
